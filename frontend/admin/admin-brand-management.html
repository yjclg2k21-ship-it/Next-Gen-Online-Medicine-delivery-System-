<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Management | Admin | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <link rel="stylesheet" href="../assets/css/admin-dark.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
        .brand-card { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid rgba(0,0,0,0.06); text-align: center; transition: all 0.2s; position: relative; }
        .brand-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        .brand-logo { width: 64px; height: 64px; border-radius: 14px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 12px auto; color: #007aff; }
        .brand-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
        .brand-card:hover .brand-actions { opacity: 1; }
        .action-btn { width: 30px; height: 30px; border-radius: 8px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #f1f5f9; color: #1d1d1f; }
        .action-btn:hover { background: #e2e8f0; }
        #add-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index:100; align-items:center; justify-content:center; }
        #add-modal.show { display:flex; }
        .modal-box { background:#fff; border-radius:24px; padding:32px; width:440px; box-shadow:0 32px 80px rgba(0,0,0,0.2); }
        .modal-box input, .modal-box select { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); background: rgba(0,0,0,0.02); font-family: Inter, sans-serif; font-size: 0.95rem; margin-top: 4px; box-sizing: border-box; transition: all 0.2s; }
        .modal-box input:focus, .modal-box select:focus { outline: none; border-color: #007aff; background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start;">
                <div>
                    <h1 class="vibrant-h1">Brand Management</h1>
                    <p style="color:#6e6e73;font-size:1rem;font-weight:500;">Manage pharmaceutical brands and manufacturers.</p>
                </div>
                <button onclick="openModal()" style="padding:10px 24px;border-radius:12px;background:#007aff;color:#fff;border:none;font-weight:700;font-size:0.9rem;cursor:pointer;font-family:Inter,sans-serif;display:flex;align-items:center;gap:8px;">
                    <i data-lucide="plus" style="width:18px;height:18px;"></i> Add New Brand
                </button>
            </header>

            <div class="liquid-card" style="padding:24px;">
                <div style="display:flex;gap:12px;margin-bottom:20px;">
                    <input type="search" placeholder="Search brands..." id="brand-search" oninput="filterBrands()" style="flex:1;padding:10px 16px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);font-family:Inter,sans-serif;font-size:0.9rem;outline:none;">
                    <select id="type-filter" onchange="filterBrands()" style="padding:10px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);font-family:Inter,sans-serif;font-size:0.85rem;outline:none;">
                        <option value="All">All Types</option>
                        <option value="MNC">MNC</option>
                        <option value="Domestic">Domestic</option>
                        <option value="Generic">Generic</option>
                        <option value="Ayurvedic">Ayurvedic</option>
                    </select>
                </div>

                <div class="brand-grid" id="brand-grid"></div>
            </div>
        </main>
    </div>

    <!-- Add Brand Modal -->
    <div id="add-modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-box animate-scale-in">
            <h2 style="font-weight:800;margin-bottom:6px;">Add New Brand</h2>
            <p style="color:#8e8e93;font-size:0.85rem;margin-bottom:24px;">Register a new pharmaceutical manufacturer.</p>
            
            <div style="display:grid;gap:16px;">
                <div>
                    <label style="display:block;font-size:0.78rem;font-weight:700;color:#6e6e73;margin-bottom:2px;">Brand Name</label>
                    <input type="text" id="new-brand-name" placeholder="e.g. GSK, Pfizer, Cipla">
                </div>
                <div>
                    <label style="display:block;font-size:0.78rem;font-weight:700;color:#6e6e73;margin-bottom:2px;">Headquarters</label>
                    <input type="text" id="new-brand-hq" placeholder="e.g. Phaltan, India">
                </div>
                <div>
                    <label style="display:block;font-size:0.78rem;font-weight:700;color:#6e6e73;margin-bottom:2px;">Type</label>
                    <select id="new-brand-type">
                        <option value="MNC">MNC</option>
                        <option value="Domestic">Domestic</option>
                        <option value="Generic">Generic</option>
                        <option value="Ayurvedic">Ayurvedic</option>
                    </select>
                </div>
                <button onclick="saveBrand()" style="margin-top:10px;width:100%;padding:14px;border-radius:14px;background:#007aff;color:#fff;border:none;font-weight:800;cursor:pointer;font-family:Inter,sans-serif;font-size:1rem;transition: opacity 0.2s;" onmouseover="this.style.opacity=0.9" onmouseout="this.style.opacity=1">Register Brand</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'admin') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('admin');
        lucide.createIcons();

        let brands = [];
        let editingId = null;

        async function loadBrands() {
            try {
                const res = await api.get('/brands');
                brands = res.brands || [];
                renderBrands(brands);
            } catch (err) {
                console.error(err);
            }
        }

        function renderBrands(list) {
            document.getElementById('brand-grid').innerHTML = list.map(b => `
                <div class="brand-card">
                    <div class="brand-actions">
                        <button class="action-btn" title="Edit" onclick="editBrand(${b.id})"><i data-lucide="edit-3" style="width:14px;height:14px;"></i></button>
                        <button class="action-btn" style="color:#ff3b30" title="Delete" onclick="deleteBrand(${b.id})"><i data-lucide="trash-2" style="width:14px;height:14px;"></i></button>
                    </div>
                    <div class="brand-logo">${b.name ? b.name[0] : '?'}</div>
                    <div style="font-weight:800;font-size:1.1rem;margin-bottom:4px;">${b.name}</div>
                    <div style="font-size:0.75rem;color:#8e8e93;font-weight:600;margin-bottom:10px;">${b.type} · ${b.hq}</div>
                    <div style="display:flex;justify-content:center;gap:12px;">
                        <div style="background:rgba(0,122,255,0.06);padding:6px 12px;border-radius:10px;">
                            <div style="font-size:0.65rem;color:#8e8e93;font-weight:700;text-transform:uppercase;">Products</div>
                            <div style="font-weight:800;color:#007aff;">${b.products || 0}</div>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function filterBrands() {
            const q = document.getElementById('brand-search').value.toLowerCase();
            const type = document.getElementById('type-filter').value;
            
            const filtered = brands.filter(b => {
                const matchSearch = (b.name && b.name.toLowerCase().includes(q)) || (b.hq && b.hq.toLowerCase().includes(q));
                const matchType = type === 'All' || b.type === type;
                return matchSearch && matchType;
            });
            renderBrands(filtered);
        }

        function openModal(editId = null) {
            editingId = editId;
            const modalTitle = document.querySelector('#add-modal h2');
            const submitBtn = document.querySelector('#add-modal button[onclick="saveBrand()"]');
            
            if (editId) {
                const b = brands.find(x => x.id === editId);
                document.getElementById('new-brand-name').value = b.name;
                document.getElementById('new-brand-hq').value = b.hq;
                document.getElementById('new-brand-type').value = b.type;
                modalTitle.textContent = 'Edit Brand';
                submitBtn.textContent = 'Update Brand';
            } else {
                document.getElementById('new-brand-name').value = '';
                document.getElementById('new-brand-hq').value = '';
                document.getElementById('new-brand-type').value = 'MNC';
                modalTitle.textContent = 'Add New Brand';
                submitBtn.textContent = 'Register Brand';
            }
            document.getElementById('add-modal').classList.add('show');
        }

        function closeModal() { document.getElementById('add-modal').classList.remove('show'); }

        function editBrand(id) { openModal(id); }

        async function deleteBrand(id) {
            const b = brands.find(x => x.id === id);
            const confirmed = await components.confirm(
                'Delete Brand',
                `Are you sure you want to delete ${b.name}? This will remove all associated pharmaceutical data.`,
                'Yes, Delete'
            );
            if (!confirmed) return;

            try {
                components.showLoader();
                const res = await api.delete(`/brands/${id}`);
                if (res.success) {
                    components.showSuccess('Brand removed from registry.');
                    loadBrands();
                }
            } catch(e) {
                components.showError("Failed to delete brand.");
            } finally {
                components.hideLoader();
            }
        }

        async function saveBrand() {
            const name = document.getElementById('new-brand-name').value;
            const hq = document.getElementById('new-brand-hq').value;
            const type = document.getElementById('new-brand-type').value;
            if(!name || !hq) return;

            const payload = { name, hq, type };
            try { 
                components.showLoader();
                const res = editingId 
                    ? await api.put(`/brands/${editingId}`, payload)
                    : await api.post('/brands', payload); 

                if (res.success) {
                    components.showSuccess(`${name} ${editingId ? 'updated' : 'registered'} successfully.`);
                    closeModal();
                    loadBrands();
                } else {
                    components.showError(res.message);
                }
            } catch(e) { 
                components.showError(`Failed to ${editingId ? 'update' : 'register'} brand.`); 
            } finally {
                components.hideLoader();
            }
        }


        loadBrands();
    </script>
</body>
</html>
