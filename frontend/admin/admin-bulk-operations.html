<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Operations | Admin | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <link rel="stylesheet" href="../assets/css/admin-dark.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .drop-zone { border: 2px dashed rgba(0,122,255,0.3); border-radius: 16px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(0,122,255,0.02); }
        .drop-zone:hover, .drop-zone.drag-over { border-color: #007aff; background: rgba(0,122,255,0.06); }
        .job-row { display: grid; grid-template-columns: 90px 1fr 120px 120px 100px; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.84rem; }
        .job-row:hover { background: rgba(0,0,0,0.02); }
        .job-header { display: grid; grid-template-columns: 90px 1fr 120px 120px 100px; gap: 12px; padding: 8px 18px; font-size: 0.72rem; font-weight: 700; color: #8e8e93; text-transform: uppercase; }
        .progress-bar-wrap { background: rgba(0,0,0,0.06); border-radius: 8px; height: 6px; width: 100%; }
        .progress-bar { height: 6px; border-radius: 8px; background: #007aff; transition: width 0.4s ease; }
        .badge-done { background:rgba(52,199,89,0.1);color:#34c759;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700; }
        .badge-proc { background:rgba(0,122,255,0.1);color:#007aff;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700; }
        .badge-fail { background:rgba(255,59,48,0.1);color:#ff3b30;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700; }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom:20px;"><h1 class="vibrant-h1">Bulk Operations</h1><p style="color:#6e6e73;font-size:1rem;font-weight:500;">Upload CSVs to mass-import medicines, users, or vendor data.</p></header>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="liquid-card" style="padding:20px;">
                    <h3 style="font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;"><i data-lucide="upload-cloud" style="color:#007aff;width:18px;height:18px;"></i> CSV Upload</h3>
                    <div style="margin-bottom:14px;">
                        <label style="font-size:0.82rem;font-weight:600;display:block;margin-bottom:6px;color:#6e6e73;">Operation Type</label>
                        <select id="op-type" style="width:100%;padding:10px 14px;border-radius:10px;border:1px solid rgba(0,0,0,0.1);font-family:Inter,sans-serif;font-size:0.88rem;outline:none;">
                            <option value="medicines">Medicine Catalog</option>
                            <option value="users">User Import</option>
                            <option value="vendors">Vendor Data</option>
                            <option value="inventory">Inventory Update</option>
                        </select>
                    </div>
                    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-input').click()" ondragover="e=>e.preventDefault()" ondrop="handleDrop(event)">
                        <div style="font-size:2.5rem;margin-bottom:12px;">📂</div>
                        <div style="font-weight:700;font-size:1rem;margin-bottom:6px;">Drop CSV file here</div>
                        <div style="font-size:0.8rem;color:#8e8e93;">or click to browse files</div>
                        <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="handleFileSelect(event)">
                    </div>
                    <div id="file-info" style="display:none;margin-top:12px;padding:12px;background:rgba(0,122,255,0.06);border-radius:12px;font-size:0.85rem;">
                        <span id="file-name" style="font-weight:700;"></span>
                        <span id="file-size" style="color:#8e8e93;margin-left:8px;"></span>
                    </div>
                    <button onclick="startUpload()" id="upload-btn" style="margin-top:14px;width:100%;padding:12px;border-radius:12px;background:#007aff;color:#fff;border:none;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;font-size:0.9rem;" disabled>Start Import</button>
                    <div style="margin-top:12px;font-size:0.75rem;color:#8e8e93;">
                        Download templates: 
                        <a href="../assets/data/medicines_template.csv" style="color:#007aff;font-weight:600;" download>Medicines CSV</a> · 
                        <a href="../assets/data/inventory_template.csv" style="color:#007aff;font-weight:600;" download>Inventory CSV</a>
                    </div>
                </div>

                <div class="liquid-card" style="padding:20px;">
                    <h3 style="font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;"><i data-lucide="zap" style="color:#ff9500;width:18px;height:18px;"></i> Quick Actions</h3>
                    <div style="display:grid;gap:10px;">
                        <button onclick="quickAction('export_orders')" style="padding:12px 16px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);background:transparent;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:Inter,sans-serif;text-align:left;display:flex;align-items:center;gap:10px;">📦 Export All Orders (CSV)</button>
                        <button onclick="quickAction('export_users')" style="padding:12px 16px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);background:transparent;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:Inter,sans-serif;text-align:left;display:flex;align-items:center;gap:10px;">👥 Export All Users (CSV)</button>
                        <button onclick="quickAction('export_inventory')" style="padding:12px 16px;border-radius:12px;border:1px solid rgba(0,0,0,0.1);background:transparent;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:Inter,sans-serif;text-align:left;display:flex;align-items:center;gap:10px;">💊 Export Medicine Catalog</button>
                        <button onclick="quickAction('clear_cache')" style="padding:12px 16px;border-radius:12px;border:1px solid rgba(255,59,48,0.2);background:rgba(255,59,48,0.04);color:#ff3b30;font-weight:600;font-size:0.85rem;cursor:pointer;font-family:Inter,sans-serif;text-align:left;display:flex;align-items:center;gap:10px;">🗑️ Clear System Cache</button>
                    </div>
                </div>
            </div>

            <div class="liquid-card" style="padding:20px;">
                <h3 style="font-weight:800;margin-bottom:16px;">Recent Jobs</h3>
                <div class="job-header"><span>Job ID</span><span>Target / Progress</span><span>Date</span><span>Status</span><span>Records</span></div>
                <div id="jobs-list"></div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'admin') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('admin');
        lucide.createIcons();

        let selectedFile = null;

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) setFile(file);
        }

        function handleDrop(e) {
            e.preventDefault();
            const file = e.dataTransfer?.files[0];
            if (file) setFile(file);
        }

        function setFile(file) {
            selectedFile = file;
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('file-size').textContent = `(${(file.size/1024).toFixed(1)} KB)`;
            document.getElementById('file-info').style.display = 'block';
            document.getElementById('upload-btn').disabled = false;
        }

        async function startUpload() {
            if (!selectedFile) return;
            const opType = document.getElementById('op-type').value;
            const btn = document.getElementById('upload-btn');
            btn.textContent = 'Uploading...'; btn.disabled = true;
            try {
                const form = new FormData();
                form.append('file', selectedFile);
                form.append('type', opType);
                const response = await fetch(`${api.BASE_URL}/admin/bulk/upload`, { 
                    method: 'POST', 
                    body: form, 
                    headers: { Authorization: `Bearer ${auth.getToken()}` } 
                });
                if (!response.ok) throw new Error('Upload failed');
            } catch(e) { components.showError(e.message || "Bulk upload rejected by node."); return; }
            components.showSuccess(`Import job for "${opType}" queued successfully.`);
            btn.textContent = 'Start Import'; btn.disabled = false;
            loadJobs();
        }

        async function loadJobs() {
            let jobs = [];
            try { 
                const r = await api.get('/admin/bulk/status/all'); 
                jobs = (r.data && r.data.jobs) || r.jobs || []; 
            } catch(e) { 
                console.warn("No bulk jobs found or API unavailable."); 
            }
            
            const container = document.getElementById('jobs-list');
            if (jobs.length === 0) {
                container.innerHTML = '<div style="padding:30px;text-align:center;color:#8e8e93;font-weight:600;">No import jobs recorded yet.</div>';
                return;
            }
            
            const statusBadge = { done:'badge-done', completed:'badge-done', processing:'badge-proc', pending:'badge-proc', failed:'badge-fail' };
            container.innerHTML = jobs.map(j => `
                <div class="job-row">
                    <span style="font-weight:700;color:#007aff">${j.id || 'BJ-' + (j.id || '?')}</span>
                    <div>
                        <div style="font-weight:600;margin-bottom:6px;">${j.target || j.type || 'Import'}</div>
                        <div class="progress-bar-wrap"><div class="progress-bar" style="width:${j.progress || 100}%;background:${j.status==='failed'?'#ff3b30':'#34c759'}"></div></div>
                    </div>
                    <span style="color:#8e8e93;font-size:0.78rem">${j.date || j.created_at || ''}</span>
                    <span><span class="${statusBadge[j.status]||'badge-proc'}">${j.status || 'unknown'}</span></span>
                    <span style="color:#6e6e73">${j.records > 0 ? j.records+' rows' : '—'}</span>
                </div>
            `).join('');
        }

        async function quickAction(action) {
            if (action === 'clear_cache') {
                const confirmed = await components.confirm('Clear Cache', 'Are you sure you want to clear the system cache?', 'Yes, Clear');
                if (!confirmed) return;
                components.showSuccess('System cache cleared.');
                return;
            }

            // Real data export
            components.showLoader();
            try {
                let data = [];
                let filename = '';
                let headers = [];

                if (action === 'export_orders') {
                    const res = await api.get('/admin/order/pulse');
                    const orders = res.data.recent_orders || [];
                    headers = ['Order ID', 'Customer', 'Pharmacy', 'Status', 'Agent', 'Delivery Type', 'Date'];
                    data = orders.map(o => [o.id, o.customer, o.pharmacy, o.status, o.agent, o.delivery_type, o.formatted_time]);
                    filename = 'orders_export.csv';
                } else if (action === 'export_users') {
                    const res = await api.get('/admin/users');
                    const users = res.data.users || [];
                    headers = ['ID', 'Name', 'Email', 'Role', 'Status'];
                    data = users.map(u => [u.id, u.name, u.email, u.role, u.status]);
                    filename = 'users_export.csv';
                } else if (action === 'export_inventory') {
                    const res = await api.get('/admin/medicines');
                    const meds = res.data.medicines || [];
                    headers = ['ID', 'Name', 'Vendor', 'Price', 'Stock', 'Approval Status'];
                    data = meds.map(m => [m.id, m.name, m.vendor_name || '', m.price, m.stock, m.approval_status]);
                    filename = 'medicines_export.csv';
                }

                if (data.length === 0) {
                    components.showError('No data to export.');
                    return;
                }

                // Generate CSV
                const csvContent = [headers.join(','), ...data.map(row => row.map(cell => `"${String(cell || '').replace(/"/g, '""')}"`).join(','))].join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.click();
                URL.revokeObjectURL(url);

                components.showSuccess(`Exported ${data.length} records to ${filename}`);
            } catch(e) {
                console.error(e);
                components.showError(e.message || 'Export failed.');
            } finally {
                components.hideLoader();
            }
        }

        loadJobs();
    </script>
</body>
</html>
