<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Admin Profile | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <link rel="stylesheet" href="../assets/css/admin-dark.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .profile-header-card {
            background: linear-gradient(135deg, #4c1d95, #5b21b6);
            padding: 40px;
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 140px;
        }

        .profile-header-card::after {
            content: ''; position: absolute; top: -50%; right: -10%; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4), transparent);
            filter: blur(40px);
        }

        .avatar-squircle {
            width: 80px; height: 80px; background: white; border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            position: relative; z-index: 2; color: #7c3aed; font-weight: 800;
            flex-shrink: 0;
        }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }

        .input-card {
            background: rgba(255,255,255,0.6); backdrop-filter: blur(20px);
            padding: 20px; border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        .input-card:focus-within {
            background: white; border-color: #7c3aed; box-shadow: 0 8px 24px rgba(124, 58, 237, 0.1);
        }

        .field-label {
            font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 8px; display: block;
        }

        .field-input {
            width: 100%; border: none; background: transparent; 
            font-size: 1.1rem; font-weight: 700; color: #1e293b;
            outline: none; padding: 0;
        }

        .badge-verified {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(255, 255, 255, 0.2); color: white;
            padding: 6px 12px; border-radius: 100px; font-size: 0.75rem; font-weight: 800;
            backdrop-filter: blur(10px);
        }

        .save-banner {
            position: fixed; bottom: 40px; right: 40px; 
            background: #7c3aed; color: white; padding: 16px 32px;
            border-radius: 100px; font-weight: 700; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.3);
            cursor: pointer; transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .save-banner.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>
    
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        
        <main class="liquid-main">
            <header style="margin-bottom: 24px;">
                <h1 class="vibrant-h1">Admin Profile</h1>
                <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Manage your administrator details and security credentials.</p>
            </header>

            <div class="profile-header-card">
                <div class="avatar-squircle" id="profileInitials">AD</div>
                <div>
                    <div class="badge-verified"><i data-lucide="shield-check" size="14"></i> SYSTEM ADMINISTRATOR</div>
                    <h2 style="font-size: 2rem; font-weight: 800; margin: 12px 0 4px 0;" id="display-name">System Admin</h2>
                    <p style="color: #ede9fe; font-weight: 600; font-size: 1.1rem;" id="display-email">admin@medimitra.com</p>
                </div>
            </div>

            <form id="profile-form" class="form-grid">
                <div class="input-card">
                    <label class="field-label">Administrator Name</label>
                    <input type="text" id="inputFirstName" class="field-input" value="" placeholder="System Admin" oninput="handleInput()">
                </div>
                <div class="input-card">
                    <label class="field-label">Phone Number</label>
                    <input type="tel" id="inputPhone" class="field-input" value="" placeholder="e.g. +91 99999 88888" oninput="handleInput()">
                </div>
                <div class="input-card">
                    <label class="field-label">Admin Email</label>
                    <input type="email" id="inputEmail" class="field-input" value="" readonly style="opacity: 0.6;">
                </div>
                <div class="input-card">
                    <label class="field-label">System Role</label>
                    <input type="text" class="field-input" value="Global Root Hub" readonly style="opacity: 0.6;">
                </div>
            </form>

            <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
                <div class="liquid-card" style="text-align: center; padding: 20px;">
                    <div style="font-size: 1.5rem; margin-bottom: 8px;">🏢</div>
                    <div style="font-weight: 800;" id="stat-vendors">—</div>
                    <div style="font-size: 0.7rem; color: #6e6e73; font-weight: 700;">NETWORK SIZE</div>
                </div>
                <div style="background: #7c3aed10; border: 1px solid #7c3aed30; border-radius: 20px; text-align: center; padding: 20px;">
                    <div style="font-size: 1.5rem; margin-bottom: 8px;">📦</div>
                    <div style="font-weight: 800; color: #7c3aed;" id="stat-orders">—</div>
                    <div style="font-size: 0.7rem; color: #6e6e73; font-weight: 700;">TOTAL ORDERS</div>
                </div>
                <div class="liquid-card" style="text-align: center; padding: 20px;">
                    <div style="font-size: 1.5rem; margin-bottom: 8px;">👥</div>
                    <div style="font-weight: 800;" id="stat-users">—</div>
                    <div style="font-size: 0.7rem; color: #6e6e73; font-weight: 700;">TOTAL USERS</div>
                </div>
            </div>

            <!-- Password Change Section -->
            <div style="margin-top: 24px;">
                <h3 style="font-weight: 800; margin-bottom: 16px;">Change Password</h3>
                <div class="form-grid">
                    <div class="input-card">
                        <label class="field-label">Current Password</label>
                        <input type="password" id="currentPassword" class="field-input" placeholder="••••••••">
                    </div>
                    <div class="input-card">
                        <label class="field-label">New Password</label>
                        <input type="password" id="newPassword" class="field-input" placeholder="Min 6 characters">
                    </div>
                </div>
                <button onclick="changePassword()" style="margin-top:14px;padding:12px 24px;border-radius:14px;background:#7c3aed;color:#fff;border:none;font-weight:700;cursor:pointer;font-family:Inter,sans-serif;">Update Password</button>
            </div>

            <div id="save-banner" class="save-banner" onclick="saveProfile()">
                <i data-lucide="save"></i> Save Profile Changes
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = auth.getUser();
            if (!user || user.role !== 'admin') {
                window.location.href = '../auth/login.html';
                return;
            }

            // Load Sidebar
            document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('admin');
            lucide.createIcons();

            await loadProfile();
        });

        async function loadProfile() {
            try {
                const res = await api.get('/user/profile');
                const user = res.data.user;

                document.getElementById('display-name').innerText = user.name;
                document.getElementById('display-email').innerText = user.email;
                document.getElementById('inputFirstName').value = user.name;
                document.getElementById('inputPhone').value = user.phone || '';
                document.getElementById('inputEmail').value = user.email;
                
                const initials = (user.name.charAt(0)).toUpperCase();
                document.getElementById('profileInitials').innerText = initials;

                // Load real platform stats
                try {
                    const dashRes = await api.get('/admin/dashboard');
                    const stats = dashRes.data.stats || {};
                    document.getElementById('stat-vendors').innerText = (stats.total_vendors || 0) + ' Vendors';
                    document.getElementById('stat-orders').innerText = stats.total_orders || 0;
                    document.getElementById('stat-users').innerText = stats.total_users || 0;
                } catch(e) {}
            } catch (err) {
                console.error("Failed to load admin profile:", err);
            }
        }

        async function changePassword() {
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            
            if (!current || !newPass) {
                components.showError('Both fields are required.');
                return;
            }
            if (newPass.length < 6) {
                components.showError('New password must be at least 6 characters.');
                return;
            }

            try {
                components.showLoader();
                await api.post('/user/password', { old_password: current, new_password: newPass });
                components.showSuccess('Password updated successfully.');
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
            } catch(e) {
                components.showError(e.message || 'Failed to update password.');
            } finally {
                components.hideLoader();
            }
        }

        function handleInput() {
            const banner = document.getElementById('save-banner');
            banner.classList.add('show');
            
            const fname = document.getElementById('inputFirstName').value;
            document.getElementById('display-name').innerText = fname;
            document.getElementById('profileInitials').innerText = (fname.charAt(0)).toUpperCase();
        }

        async function saveProfile() {
            const banner = document.getElementById('save-banner');
            const originalHtml = banner.innerHTML;
            banner.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Saving...';
            lucide.createIcons();

            const data = {
                name: document.getElementById('inputFirstName').value.trim(),
                phone: document.getElementById('inputPhone').value.trim()
            };

            try {
                const res = await api.post('/user/profile/update', data);
                if (res.success) {
                    const user = auth.getUser();
                    user.name = data.name;
                    localStorage.setItem('user', JSON.stringify(user));
                    
                    banner.innerHTML = '<i data-lucide="check"></i> Profile Saved!';
                    banner.style.background = '#059669';
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        banner.classList.remove('show');
                        setTimeout(() => {
                            banner.innerHTML = originalHtml;
                            banner.style.background = '';
                            lucide.createIcons();
                        }, 400);
                    }, 2000);
                }
            } catch (err) {
                components.showError(err.message);
                banner.innerHTML = originalHtml;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
