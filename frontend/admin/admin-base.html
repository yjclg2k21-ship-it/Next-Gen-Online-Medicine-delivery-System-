<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Base Template | MediMitra</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/glass.css">
</head>
<body>
    <div id="loader" class="loader-overlay"><div class="loader-spinner"></div></div>
    <div id="sidebar-root"></div>
    <main class="main-content" style="flex: 1; margin-left: 260px; padding: 2.5rem;">
        <div id="header-root"></div>
        <div class="content-area animate-fade-in">
            <div class="glass-card">
                <h1 id="page-title">Admin Module</h1>
                <p style="color: var(--grey);">Clinical module skeleton ready. Advanced logic coming soon.</p>
                <div style="margin-top: 2rem; padding: var(--l-card-p); border: 2px dashed var(--border); border-radius: var(--l-card-r); text-align: center; opacity: 0.5;">
                    <span style="font-size: 3rem;">🏗️</span>
                </div>
            </div>
        </div>
        <div id="footer-root"></div>
    </main>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/ui-loader.js"></script>
    <script>
        document.getElementById('page-title').innerText = document.title.replace(' | MediMitra', '');
    </script>
    <style>
        body { display: flex; min-height: 100vh; background: #f8fafc; }
        @media (max-width: 992px) { .main-content { margin-left: 0 !important; } }
    </style>
</body>
</html>
