<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Admin | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <link rel="stylesheet" href="../assets/css/admin-dark.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .user-grid-container { background: rgba(255, 255, 255, 0.4); border-radius: var(--l-card-r); padding: var(--l-card-p); border: 1px solid rgba(255, 255, 255, 0.5); flex: 1; overflow-y: auto; max-height: calc(100vh - 200px); }
        .user-card-list { display: grid; gap: 16px; }
        .user-row { background: rgba(255, 255, 255, 0.3); padding: 16px 24px; border-radius: var(--l-card-r); display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr 100px; align-items: center; transition: all 0.3s ease; }
        .user-row:hover { background: white; transform: scale(1.005); }
        .role-chip { padding: 6px 14px; border-radius: 100px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .chip-admin { background: rgba(255, 59, 48, 0.1); color: var(--danger); }
        .chip-vendor { background: rgba(255, 149, 0, 0.1); color: var(--warning); }
        .chip-user { background: rgba(0, 122, 255, 0.1); color: var(--primary); }
        .action-icon { width: 35px; height: 35px; border-radius: var(--l-card-r); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; color: #6e6e73; }
        .action-icon:hover { background: rgba(0,0,0,0.05); color: #1d1d1f; }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="vibrant-h1">Clinical Nodes</h1>
                    <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Registry of all authenticated users and pharmacy partners.</p>
                </div>
                <div style="display: flex; gap: 12px;">
                    <button class="pill-button" onclick="showCreateModal()"><i data-lucide="plus-circle"></i> Register Node</button>
                    <div style="background: rgba(255,255,255,0.4); border-radius: var(--l-card-r); padding: 8px 16px; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(255,255,255,0.3);">
                        <i data-lucide="search" size="18" style="color: #6e6e73;"></i>
                        <input type="text" id="user-search" placeholder="Lookup node..." style="background: transparent; border: none; outline: none; font-size: 0.95rem; font-weight: 600;">
                    </div>
                </div>
            </header>

            <!-- Personnel Creation Modal -->
            <div id="create-modal" class="liquid-modal-overlay">
                <div class="liquid-modal-card">
                    <div class="modal-header">
                        <h2 class="vibrant-h2" style="font-size: 1.5rem;">Register New Clinical Node</h2>
                        <button class="modal-close" onclick="hideCreateModal()">&times;</button>
                    </div>
                    <form id="create-user-form" style="margin-top: 24px;">
                        <label class="field-label">Full Name</label>
                        <div class="input-card" style="margin-bottom: 16px;">
                            <input type="text" id="new-name" class="field-input" placeholder="e.g. Suresh Delivery" required>
                        </div>
                        <label class="field-label">Network Email</label>
                        <div class="input-card" style="margin-bottom: 16px;">
                            <input type="email" id="new-email" class="field-input" placeholder="name@medimitra.com" required>
                        </div>
                        <label class="field-label">Temporary Access Token</label>
                        <div class="input-card" style="margin-bottom: 16px;">
                            <input type="password" id="new-password" class="field-input" placeholder="••••••••" required>
                        </div>
                        <label class="field-label">Clinical Class (Role)</label>
                        <select id="new-role" class="auth-input" style="background: rgba(0,0,0,0.03); margin-bottom: 24px;">
                            <option value="delivery">Delivery Partner (Logistics)</option>
                            <option value="vendor">Pharmacist (Supply)</option>
                            <option value="admin">Administrator (Control)</option>
                        </select>
                        <button type="submit" class="pill-button" style="width: 100%; justify-content: center;">Initialize Node</button>
                    </form>
                </div>
            </div>

            <div style="display:flex; gap:12px; align-items:center; margin-bottom:20px; flex-wrap:wrap;">
                <input type="text" id="userSearchInput" placeholder="Search name, email..." oninput="applyUserFilters()" style="padding:10px 16px; border-radius:10px; border:1px solid rgba(0,0,0,0.1); font-family:Inter,sans-serif; font-size:0.85rem; min-width:200px; outline:none;">
                <select id="userFilterSelect" onchange="applyUserFilters()" style="padding:10px 16px; border-radius:10px; border:1px solid rgba(0,0,0,0.1); font-family:Inter,sans-serif; font-size:0.85rem; font-weight:600;">
                    <option value="all">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="vendor">Vendor</option>
                    <option value="user">User</option>
                    <option value="delivery">Delivery</option>
                </select>
                <select id="userSortSelect" onchange="applyUserFilters()" style="padding:10px 16px; border-radius:10px; border:1px solid rgba(0,0,0,0.1); font-family:Inter,sans-serif; font-size:0.85rem; font-weight:600;">
                    <option value="name_az">Name A-Z</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>

            <div class="user-grid-container">
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr 100px; padding: 0 24px 16px 24px; color: #6e6e73; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;">
                    <span>Identity</span>
                    <span>Class</span>
                    <span>Status</span>
                    <span>Verified At</span>
                    <span>Actions</span>
                </div>
                <div class="user-card-list" id="user-list">
                    <!-- Dynamic Rendering via Phase 6 Wiring -->
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'admin') { window.location.href = '../auth/login.html'; }
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('admin');
        lucide.createIcons();

        let allUsers = [];

        async function loadUsers() {
            try {
                components.showLoader();
                const res = await api.get('/admin/users');
                allUsers = (res && res.data && res.data.users) ? res.data.users : [];
                renderUsers(allUsers);
            } catch (err) {
                console.error('Failed to load clinical nodes:', err);
                renderUsers([]); // Show empty state on error
            } finally {
                components.hideLoader();
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('user-list');
            if (!users || users.length === 0) {
                container.innerHTML = '<div style="padding:60px; text-align:center; color:#8e8e93; font-weight:600;">No medical nodes currently present in the registry.</div>';
                return;
            }
            container.innerHTML = users.map(u => {
                const initials = u.name.split(' ').map(n => n[0]).join('').toUpperCase();
                const roleClass = u.role === 'admin' ? 'chip-admin' : (u.role === 'vendor' ? 'chip-vendor' : 'chip-user');
                const roleLabel = u.role === 'admin' ? 'Admin' : (u.role === 'vendor' ? 'Pharmacist' : 'Patient');
                const isActive = u.status == 1 || u.status === 'active';
                
                return `
                    <div class="user-row" id="user-${u.id}" style="opacity: ${isActive ? '1' : '0.6'}">
                        <div style="display: flex; align-items: center; gap: 20px;">
                            <div style="width: 42px; height: 42px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #007aff; border: 1px solid rgba(0,0,0,0.05);">${initials}</div>
                            <div>
                                <div style="font-weight: 800; color: #1d1d1f; font-size: 0.95rem;">${u.name}</div>
                                <div style="font-size: 0.75rem; color: #8e8e93; font-weight: 500;">${u.email}</div>
                            </div>
                        </div>
                        <div><span class="role-chip ${roleClass}">${roleLabel}</span></div>
                        <div class="user-status">
                            <span style="display: inline-block; width: 8px; height: 8px; background: ${isActive ? '#34c759' : '#8e8e93'}; border-radius: 50%; margin-right: 8px;"></span>
                            <span style="font-weight: 700; font-size: 0.85rem; color: ${isActive ? '#1d1d1f' : '#8e8e93'};">${isActive ? 'Active Node' : 'Suspended'}</span>
                        </div>
                        <div style="color: #6e6e73; font-size: 0.85rem; font-weight: 600;">${new Date(u.joined).toLocaleDateString()}</div>
                        <div style="display: flex; gap: 6px;">
                            <div class="action-icon" onclick="window.location.href='admin-user-detail.html?id=${u.id}'"><i data-lucide="external-link" size="16"></i></div>
                            <div class="action-icon" style="color: ${isActive ? '#ff3b30' : '#34c759'};" onclick="toggleUserStatus(${u.id}, ${isActive})">
                                <i data-lucide="${isActive ? 'lock' : 'unlock'}" size="16"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function toggleUserStatus(id, currentlyActive) {
            const action = currentlyActive ? 'block' : 'unblock';
            const confirmed = await components.confirm(
                currentlyActive ? 'Block User' : 'Unblock User',
                `Are you sure you want to ${action} this user?`,
                currentlyActive ? 'Yes, Block' : 'Yes, Unblock'
            );
            if (!confirmed) return;

            try {
                components.showLoader();
                await api.post(`/admin/users/${id}/${action}`);
                components.showSuccess(`User has been ${action}ed.`);
                loadUsers();
            } catch (err) { console.error(err); } finally { components.hideLoader(); }
        }

        document.getElementById('user-search').addEventListener('input', () => applyUserFilters());

        function applyUserFilters() {
            const q = (document.getElementById('userSearchInput').value || document.getElementById('user-search').value || '').toLowerCase();
            const role = document.getElementById('userFilterSelect').value;
            const sort = document.getElementById('userSortSelect').value;

            let filtered = allUsers.filter(u => {
                const matchSearch = u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
                const matchRole = role === 'all' || u.role === role;
                return matchSearch && matchRole;
            });

            if (sort === 'name_az') filtered.sort((a, b) => a.name.localeCompare(b.name));
            else if (sort === 'newest') filtered.sort((a, b) => new Date(b.joined) - new Date(a.joined));
            else if (sort === 'oldest') filtered.sort((a, b) => new Date(a.joined) - new Date(b.joined));

            renderUsers(filtered);
        }

        // Modal Logic
        function showCreateModal() { 
            document.getElementById('create-modal').classList.add('show');
        }
        function hideCreateModal() { 
            document.getElementById('create-modal').classList.remove('show');
        }

        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('new-name').value,
                email: document.getElementById('new-email').value,
                password: document.getElementById('new-password').value,
                role: document.getElementById('new-role').value
            };

            try {
                components.showLoader();
                await api.post('/admin/users/create', payload);
                components.showSuccess('Clinical node registered successfully.');
                hideCreateModal();
                loadUsers();
            } catch (err) { console.error(err); } finally { components.hideLoader(); }
        });

        loadUsers();
    </script>
</body>
</html>
