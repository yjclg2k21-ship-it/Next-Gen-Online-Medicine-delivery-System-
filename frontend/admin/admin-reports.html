<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytical Reports | Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <link rel="stylesheet" href="../assets/css/admin-dark.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { padding: 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.4); position: relative; overflow: hidden; transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .stat-card.blue { background: linear-gradient(135deg, rgba(0,122,255,0.08), rgba(255,255,255,0.4)); }
        .stat-card.green { background: linear-gradient(135deg, rgba(52,199,89,0.08), rgba(255,255,255,0.4)); }
        .stat-card.orange { background: linear-gradient(135deg, rgba(255,149,0,0.08), rgba(255,255,255,0.4)); }
        .stat-card .label { font-size: 0.72rem; font-weight: 800; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.08em; display: block; margin-bottom: 6px; }
        .stat-card .value { font-size: 2rem; font-weight: 800; color: #1d1d1f; letter-spacing: -0.03em; }
        .chart-container { position: relative; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom: 30px;">
                <h1 class="vibrant-h1">Analytical Intelligence</h1>
                <p style="color: #6e6e73; font-size: 1rem; font-weight: 500;">High-fidelity reports on revenue, growth, and clinical throughput.</p>
            </header>

            <div class="stats-grid">
                <div class="stat-card blue">
                    <span class="label">Retention Rate</span>
                    <h3 id="m-retention" class="value">--</h3>
                </div>
                <div class="stat-card orange">
                    <span class="label">Avg Order Value</span>
                    <h3 id="m-aov" class="value">--</h3>
                </div>
                <div class="stat-card green">
                    <span class="label">Fulfillment Yield</span>
                    <h3 id="m-yield" class="value">--</h3>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 24px;">
                <section class="liquid-card" style="padding: 24px;">
                    <h2 style="font-weight: 800; font-size: 1.1rem; color: #1d1d1f;">Revenue Propagation (30D)</h2>
                    <div class="chart-container" style="height: 240px;">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </section>
                <section class="liquid-card" style="padding: 24px;">
                    <h2 style="font-weight: 800; font-size: 1.1rem; color: #1d1d1f;">Global User Growth</h2>
                    <div class="chart-container" style="height: 240px;">
                        <canvas id="growthChart"></canvas>
                    </div>
                </section>
            </div>

            <section class="liquid-card" style="margin-top: 24px; padding: 24px;">
                <h2 style="font-weight: 800; font-size: 1.1rem; color: #1d1d1f; margin-bottom: 20px;">Top Dispatched Medicines</h2>
                <div id="product-list" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                    <p style="color: #8e8e93; font-size: 0.9rem;">Analyzing sales artifacts...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        if (auth.getUser()?.role !== 'admin') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('admin');
        lucide.createIcons();

        async function initDashboard() {
            try {
                const res = await api.get('/admin/reports/revenue');
                const data = res.data;

                document.getElementById('m-retention').innerText = data.kpis.retention_rate;
                document.getElementById('m-aov').innerText = data.kpis.avg_order_value;
                document.getElementById('m-yield').innerText = data.kpis.fulfillment_yield;

                // Revenue Chart
                const ctxRev = document.getElementById('revenueChart').getContext('2d');
                const gradRev = ctxRev.createLinearGradient(0, 0, 0, 240);
                gradRev.addColorStop(0, 'rgba(0, 122, 255, 0.2)');
                gradRev.addColorStop(1, 'rgba(0, 122, 255, 0)');

                new Chart(ctxRev, {
                    type: 'line',
                    data: {
                        labels: data.revenue_series.map(row => row.date),
                        datasets: [{
                            label: 'Revenue',
                            data: data.revenue_series.map(row => row.amount),
                            borderColor: '#007aff',
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#fff',
                            pointBorderWidth: 2,
                            backgroundColor: gradRev,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: { 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { font: { size: 10 } } },
                            x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                        }
                    }
                });

                // Growth Chart
                const ctxGro = document.getElementById('growthChart').getContext('2d');
                const gradGro = ctxGro.createLinearGradient(0, 0, 0, 240);
                gradGro.addColorStop(0, '#34c759');
                gradGro.addColorStop(1, '#30d158');

                new Chart(ctxGro, {
                    type: 'bar',
                    data: {
                        labels: data.user_growth.map(row => row.date),
                        datasets: [{
                            label: 'New Users',
                            data: data.user_growth.map(row => row.count),
                            backgroundColor: gradGro,
                            borderRadius: 6,
                            barThickness: 24
                        }]
                    },
                    options: { 
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.03)' }, ticks: { font: { size: 10 } } },
                            x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                        }
                    }
                });

                const list = document.getElementById('product-list');
                list.innerHTML = data.top_products.map(p => `
                    <div style="background: rgba(0,0,0,0.02); padding: 16px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.03); display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-weight: 700; color: #1d1d1f; font-size: 0.9rem;">${p.name}</div>
                            <div style="font-size: 0.72rem; color: #8e8e93; font-weight: 600;">Clinical Throughput</div>
                        </div>
                        <span style="background: rgba(52,199,89,0.1); color: #34c759; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700;">${p.sales} Qty</span>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
            }
        }

        initDashboard();
    </script>
</body>
</html>
