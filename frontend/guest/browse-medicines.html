<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #f2f2f7; overflow-x: hidden; height: auto; display: block; min-height: 100vh; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .g-nav {
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05); z-index: 1000; padding: 16px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .g-container { max-width: 1400px; margin: 40px auto; padding: 0 40px; }

        .search-hero {
            background: white; border-radius: 24px; padding: 12px 24px; margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05);
            display: flex; gap: 16px; align-items: center;
        }
        .search-hero input { flex: 1; border: none; outline: none; font-size: 1.2rem; font-weight: 600; color: #1d1d1f; }

        .med-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px;
        }

        .medicine-card {
            background: white; border-radius: 20px; overflow: hidden;
            border: 1px solid rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; height: 100%;
        }
        .medicine-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        
        .medicine-img { 
            height: 140px; background: #f8f9fa; display: flex; align-items: center; 
            justify-content: center; font-size: 2.5rem; position: relative; 
            border-bottom: 1px solid rgba(0,0,0,0.02);
        }
        .medicine-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .medicine-category { color: var(--primary); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.05em; }
        .medicine-name { font-size: 1.2rem; font-weight: 800; color: #1d1d1f; margin-bottom: 4px; }
        .medicine-desc { color: #6e6e73; font-size: 0.85rem; margin-bottom: 16px; line-height: 1.4; flex: 1; min-height: 40px; }
        .medicine-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.03); }
        .medicine-price { font-size: 1.3rem; font-weight: 800; color: #1d1d1f; }
        
        .pill-button.small { padding: 8px 16px; font-size: 0.8rem; }
    </style>
</head>
<body>
    
    <!-- Navigation -->
    <nav class="g-nav">
        <div style="display: flex; align-items: center; gap: 40px;">
            <a href="../index.html" style="font-weight: 900; font-size: 1.5rem; text-decoration: none; color: #1d1d1f; letter-spacing: -0.03em;">MediMitra</a>
        </div>
        <div style="display: flex; gap: 12px;">
            <a href="../auth/login.html" class="pill-button" style="background: white; color: black; border: 1px solid rgba(0,0,0,0.1);">Login</a>
            <a href="../auth/register.html" class="pill-button">Sign Up</a>
        </div>
    </nav>

    <main class="g-container">
        <div style="margin-bottom: 40px;">
            <h1 class="vibrant-h1" style="font-size: 3.5rem; margin-bottom: 8px; letter-spacing: -0.02em;">Ecosystem Discovery</h1>
            <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Browse and search from our full range of medicines.</p>
        </div>

        <div class="search-hero">
            <i data-lucide="search" size="24" style="color: var(--primary); opacity: 0.8;"></i>
            <input type="text" id="searchInput" placeholder="Search by name, category, or chemical compound...">
        </div>

        <div id="medicinesContainer" class="med-grid">
            <!-- Loading State -->
            <div style="grid-column: 1/-1; text-align: center; padding: 100px 0;">
                <div class="loader" style="margin: 0 auto 24px;"></div>
                <p style="color: #8e8e93; font-weight: 600; font-size: 1.1rem;">Loading medicines...</p>
            </div>
        </div>
    </main>

    <footer style="padding: 60px 40px; text-align: center; color: #8e8e93; font-weight: 600; border-top: 1px solid rgba(0,0,0,0.05); margin-top: 80px; font-size: 0.9rem;">
        &copy; 2026 MediMitra. All rights reserved.
    </footer>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        let allMedicines = [];

        async function init() {
            lucide.createIcons();
            await fetchMedicines();
            
            // Setup Search with Debounce
            let timeout = null;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => filterMedicines(e.target.value), 200);
            });
        }

        async function fetchMedicines() {
            try {
                const res = await api.get('/medicines');
                if (res.success) {
                    allMedicines = res.data.medicines || (Array.isArray(res.data) ? res.data : []);
                    renderMedicines(allMedicines);
                } else {
                    throw new Error('Sync failed');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('medicinesContainer').innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 80px; color: #ff3b30;">
                        <i data-lucide="server-crash" size="64" style="margin-bottom: 24px; opacity: 0.3;"></i>
                        <h2 style="font-weight: 800; font-size: 1.8rem;">Server Unavailable</h2>
                        <p style="font-weight: 600;">Could not load medicines. Please check your connection and try again.</p>
                        <button class="pill-button" onclick="fetchMedicines()" style="margin-top: 24px;">Retry</button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderMedicines(list) {
            const container = document.getElementById('medicinesContainer');
            if (list.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 80px; color: #8e8e93;">
                        <i data-lucide="package-search" size="64" style="margin-bottom: 24px; opacity: 0.3;"></i>
                        <h2 style="font-weight: 800; font-size: 1.8rem;">No Records Found</h2>
                        <p style="font-weight: 600;">No medicines found for your search.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = list.map(med => `
                <div class="medicine-card animate-scale-in">
                    <div class="medicine-img">${getEmoji(med.category_name)}</div>
                    <div class="medicine-info">
                        <div class="medicine-category">${med.category_name || 'Generic'}</div>
                        <div class="medicine-name">${med.name}</div>
                        <p class="medicine-desc">${(med.salt && med.salt.toLowerCase().includes(med.name.toLowerCase())) ? '' : (med.salt || '')}</p>
                        <div class="medicine-footer">
                            <span class="medicine-price">₹${parseFloat(med.price).toLocaleString('en-IN', {minimumFractionDigits: 2})}</span>
                            <button class="pill-button small" onclick="window.location.href='../auth/login.html'">View Order</button>
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function filterMedicines(query) {
            const q = query.toLowerCase().trim();
            if (!q) {
                renderMedicines(allMedicines);
                return;
            }
            const filtered = allMedicines.filter(m => 
                m.name.toLowerCase().includes(q) || 
                (m.category_name && m.category_name.toLowerCase().includes(q)) ||
                (m.salt && m.salt.toLowerCase().includes(q))
            );
            renderMedicines(filtered);
        }

        function getEmoji(category) {
            const cat = (category || '').toLowerCase();
            if (cat.includes('tablet')) return '💊';
            if (cat.includes('syrup')) return '🧪';
            if (cat.includes('injection')) return '💉';
            if (cat.includes('device')) return '📟';
            if (cat.includes('eye')) return '👁️';
            if (cat.includes('care')) return '🩺';
            return '📦';
        }

        init();
    </script>
</body>
</html>
