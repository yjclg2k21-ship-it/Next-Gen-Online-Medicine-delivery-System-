<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Manager | Vendor MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main" style="overflow-y:auto;">
            <header style="margin-bottom:24px;">
                <h1 class="vibrant-h1">Payout Manager</h1>
                <p style="color:#6e6e73; font-size:1rem; font-weight:500;">Manage your pharmacy commissions and settlement requests.</p>
            </header>

            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:24px;">
                <div class="liquid-card" style="padding:20px; text-align:center; background:linear-gradient(135deg, #34c759, #32d74b); color:white; border:none;">
                    <div style="font-size:0.75rem; font-weight:800; text-transform:uppercase; opacity:0.85;">Settled Earnings</div>
                    <div style="font-size:1.8rem; font-weight:800; margin-top:8px;" id="cleared-amount">—</div>
                </div>
                <div class="liquid-card" style="padding:20px; text-align:center; background:linear-gradient(135deg, #007aff, #5856d6); color:white; border:none;">
                    <div style="font-size:0.75rem; font-weight:800; text-transform:uppercase; opacity:0.85;">Pending Balance</div>
                    <div style="font-size:1.8rem; font-weight:800; margin-top:8px;" id="pending-amount">—</div>
                </div>
                <div class="liquid-card" style="padding:20px; text-align:center; background:linear-gradient(135deg, #1d1d1f, #434345); color:white; border:none;">
                    <div style="font-size:0.75rem; font-weight:800; text-transform:uppercase; opacity:0.85;">Total Net Profit</div>
                    <div style="font-size:1.8rem; font-weight:800; margin-top:8px;" id="total-earnings">—</div>
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
                <div class="liquid-card" style="padding:24px;">
                    <h3 style="font-weight:800; margin-bottom:20px;">Request Settlement</h3>
                    <form id="payout-form" style="display:flex; flex-direction:column; gap:16px;">
                        <div>
                            <label style="font-size:0.85rem; font-weight:700; color:#6e6e73; display:block; margin-bottom:6px;">Amount to Withdraw (₹)</label>
                            <input type="number" id="payout-amount" placeholder="e.g. 5000" required step="0.01" style="width:100%; padding:12px 16px; border:1px solid rgba(0,0,0,0.1); border-radius:12px; font-size:1rem; font-family:Inter,sans-serif; outline:none; box-sizing:border-box;">
                        </div>
                        <div>
                            <label style="font-size:0.85rem; font-weight:700; color:#6e6e73; display:block; margin-bottom:6px;">Payout Channel</label>
                            <select id="payout-method" style="width:100%; padding:12px 16px; border:1px solid rgba(0,0,0,0.1); border-radius:12px; font-size:1rem; font-family:Inter,sans-serif; outline:none; box-sizing:border-box; background:#fff;">
                                <option value="bank">Bank Account (Standard 3-5 days)</option>
                                <option value="wallet">MediWallet Credit (Instant)</option>
                            </select>
                        </div>
                        <button type="submit" class="pill-button" style="width:100%; justify-content:center; background:var(--primary); color:#fff; padding:14px;">
                            <i data-lucide="arrow-right-circle"></i> Submit Withdrawal
                        </button>
                    </form>
                </div>

                <div class="liquid-card" style="padding:24px;">
                    <h3 style="font-weight:800; margin-bottom:20px;">Recent Commissions</h3>
                    <div id="payout-history">
                        <p style="color:#8e8e93; text-align:center; padding:20px;">Loading...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'vendor') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('vendor');
        lucide.createIcons();

        async function loadPayoutData() {
            try {
                components.showLoader();
                const res = await api.get('/vendor/commissions');
                const stats = (res.data && res.data.stats) ? res.data.stats : {};
                const commissions = (res.data && res.data.commissions) ? res.data.commissions : [];

                document.getElementById('cleared-amount').textContent = '₹' + (stats.cleared_amount || 0).toLocaleString();
                document.getElementById('pending-amount').textContent = '₹' + (stats.pending_amount || 0).toLocaleString();
                document.getElementById('total-earnings').textContent = '₹' + (stats.total_earnings || 0).toLocaleString();

                const history = document.getElementById('payout-history');
                if (commissions.length === 0) {
                    history.innerHTML = '<p style="color:#8e8e93; text-align:center; padding:20px;">No commission records yet.</p>';
                } else {
                    history.innerHTML = commissions.map(c => `
                        <div style="display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(0,0,0,0.05);">
                            <div>
                                <div style="font-weight:700; font-size:0.95rem;">Order #${c.order_id}</div>
                                <div style="font-size:0.8rem; color:#8e8e93;">${new Date(c.created_at).toLocaleDateString()}</div>
                            </div>
                            <div style="text-align:right;">
                                <div style="font-weight:800; color:var(--success);">+₹${parseFloat(c.commission_amount || 0).toFixed(2)}</div>
                                <div style="font-size:0.7rem; color:#8e8e93;">${c.status}</div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            } finally {
                components.hideLoader();
            }
        }

        document.getElementById('payout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('payout-amount').value);
            if (!amount || amount <= 0) { components.showError('Enter a valid amount.'); return; }

            // Check pending balance before submitting
            const pendingText = document.getElementById('pending-amount').textContent.replace(/[₹,]/g, '');
            const pendingBalance = parseFloat(pendingText) || 0;
            if (pendingBalance <= 0) {
                components.showError('No pending balance available for withdrawal.');
                return;
            }
            if (amount > pendingBalance) {
                components.showError(`Amount exceeds your pending balance of ₹${pendingBalance.toLocaleString()}.`);
                return;
            }

            try {
                components.showLoader();
                await api.post('/vendor/payout/request', { amount });
                components.showSuccess('Payout request submitted successfully.');
                document.getElementById('payout-form').reset();
                loadPayoutData();
            } catch (err) {
                components.showError('Failed to submit payout request.');
            } finally {
                components.hideLoader();
            }
        });

        loadPayoutData();
    </script>
</body>
</html>
