<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Blogs | MediMitra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: var(--light); min-height: 100vh; display: block; overflow-x: hidden; }
        .blog-hero { padding: 120px 0 80px; text-align: center; }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
            margin-bottom: 100px;
        }

        .blog-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .blog-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .blog-image {
            height: 200px;
            background: #e2e8f0;
            background-size: cover;
            background-position: center;
        }

        .blog-content {
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .blog-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .blog-content p {
            color: var(--grey);
            margin-bottom: 20px;
            line-height: 1.6;
            flex: 1;
        }

        .blog-meta {
            display: flex;
            justify-content: space-between;
            color: var(--grey);
            font-size: 0.9rem;
            font-weight: 600;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader-overlay"><div class="loader-spinner"></div></div>
    <div id="header-root"></div>
    
    <main>
        <section class="blog-hero">
            <div class="container">
                <span class="badge" style="margin-bottom: 1.5rem;">KNOWLEDGE BASE</span>
                <h1 style="font-size: var(--l-h1); font-weight: 900; letter-spacing: -0.03em;">Health <span style="color: var(--primary);">Insights</span></h1>
                <p style="color: var(--grey); font-size: 1.2rem; margin-top: 10px;">Expert clinical advice and medical news.</p>
            </div>
        </section>

        <section class="container">
            <div class="blog-grid" id="blogContainer">
                <!-- Blogs injected here -->
            </div>
        </section>
    </main>

    <div id="footer-root"></div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script src="../assets/js/ui-loader.js"></script>
    <script>
        async function loadBlogs() {
            try {
                const res = await api.get('/public/blogs');
                const container = document.getElementById('blogContainer');
                
                if (!res.data || !res.data.blogs || res.data.blogs.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--grey);">No articles published yet.</div>';
                    return;
                }

                container.innerHTML = res.data.blogs.map(blog => {
                    const date = new Date(blog.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                    const imgStyle = blog.cover_image ? `background-image: url('${blog.cover_image}')` : `background: linear-gradient(135deg, rgba(0,122,255,0.1), rgba(0,122,255,0.2))`;
                    
                    return `
                        <div class="blog-card animate-scale-in" onclick="window.location.href='blog-detail.html?slug=${blog.slug}'">
                            <div class="blog-image" style="${imgStyle}"></div>
                            <div class="blog-content">
                                <h2>${blog.title}</h2>
                                <p>${blog.excerpt.replace(/<[^>]*>?/gm, '').substring(0, 100)}...</p>
                                <div class="blog-meta">
                                    <span>${blog.author_name}</span>
                                    <span>${date}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('blogContainer').innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--danger);">Failed to load blogs.</div>';
            }
        }

        loadBlogs();
    </script>
</body>
</html>
