<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addresses | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .a-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 10px;
        }

        .a-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--l-card-r);
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .a-card:hover { transform: translateX(5px); background: rgba(255, 255, 255, 0.6); }
        .a-card.default { border: 2px solid var(--primary); }

        .a-icon-circle {
            width: 48px; height: 48px; background: white; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .a-tag {
            background: var(--primary); color: white;
            padding: 2px 10px; border-radius: 100px;
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            margin-left: 10px;
        }

        /* Modal Styles */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            display: none; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; width: 800px; border-radius: 24px; padding: 32px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
        }
        #picker-map { height: 400px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 800; color: #6e6e73; text-transform: uppercase; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; font-weight: 600; }
    </style>
</head>
<body>
    
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        
        <main class="liquid-main">
            <header style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="vibrant-h1">Locations</h1>
                    <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Saved delivery addresses.</p>
                </div>
                <button class="pill-button" onclick="openModal()"><i data-lucide="plus"></i> New Address</button>
            </header>

            <div class="a-grid" id="address-container">
                <!-- Dynamic Addresses -->
            </div>
        </main>
    </div>

    <!-- Add Address Modal -->
    <div class="modal" id="address-modal">
        <div class="modal-content animate-scale-in">
            <div>
                <h2 style="font-weight: 800; margin-bottom: 8px;">Pin Your Location</h2>
                <p style="color: #6e6e73; font-size: 0.9rem; margin-bottom: 20px;">Click on the map to set your precise home pin.</p>
                <div id="picker-map"></div>
                <div style="margin-top: 12px; display: flex; gap: 8px; color: var(--primary); font-size: 0.75rem; font-weight: 800;">
                    <i data-lucide="map-pin" style="width: 14px;"></i>
                    Lat: <span id="lat-val">None</span>, Lng: <span id="lng-val">None</span>
                </div>
            </div>
            <form id="address-form" onsubmit="saveAddress(event)">
                <div class="form-group">
                    <label>Label (e.g. Home, Office)</label>
                    <input type="text" id="label" placeholder="Home" required>
                </div>
                <div class="form-group">
                    <label>Full Address</label>
                    <input type="text" id="line1" placeholder="Building, Street Name" required>
                </div>
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="city" value="Phaltan" required>
                </div>
                <div class="form-group">
                    <label>Pincode / Zone</label>
                    <select id="pincode" style="padding: 12px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.1); background: white; width: 100%; font-family: inherit; font-size: 0.95rem; font-weight: 600;" required>
                        <option value="415523">415523 - Central Phaltan Zone (City, Kolki, Market Yard)</option>
                        <option value="415537">415537 - North / NE Zone (Kurvali Khurd side, Rural)</option>
                        <option value="415528">415528 - East / SE Zone (Pimparad side, Agr. villages)</option>
                        <option value="415521">415521 - West / NW Zone (Saswad side, Canal belt)</option>
                        <option value="415509">415509 - Outer Rural / Satara-side Connection</option>
                    </select>
                </div>
                <input type="hidden" id="lat">
                <input type="hidden" id="lng">

                <div style="display: flex; gap: 12px; margin-top: 32px;">
                    <button type="submit" class="pill-button" style="flex: 1; justify-content: center;">Save Location</button>
                    <button type="button" class="pill-button" onclick="closeModal()" style="background: rgba(0,0,0,0.05); color: black;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        // Check Auth
        const user = auth.getUser();
        if (!user) { window.location.href = '../auth/login.html'; }

        // Load Sidebar
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('user');
        lucide.createIcons();

        let map, marker;
        const phaltanCenter = [17.9868, 74.4379];

        function initMap() {
            if (map) return;
            map = L.map('picker-map').setView(phaltanCenter, 14);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
                attribution: '&copy; CartoDB'
            }).addTo(map);

            map.on('click', (e) => {
                const { lat, lng } = e.latlng;
                updateMarker(lat, lng);
            });
        }

        function updateMarker(lat, lng) {
            if (marker) {
                marker.setLatLng([lat, lng]);
            } else {
                const homeIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: "<div style='background:#ff3b30; color:white; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.2);'><i data-lucide='home' style='width:16px;'></i></div>",
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                marker = L.marker([lat, lng], { icon: homeIcon }).addTo(map);
                lucide.createIcons();
            }
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
            document.getElementById('lat-val').innerText = lat.toFixed(5);
            document.getElementById('lng-val').innerText = lng.toFixed(5);
        }

        function openModal() {
            editingId = null;
            document.getElementById('address-form').reset();
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';
            document.getElementById('lat-val').innerText = 'None';
            document.getElementById('lng-val').innerText = 'None';
            if (marker) map.removeLayer(marker);
            marker = null;
            
            document.getElementById('address-modal').style.display = 'flex';
            setTimeout(initMap, 100);
        }

        let editingId = null;
        function openEditModal(addr) {
            editingId = addr.id;
            document.getElementById('label').value = addr.label;
            document.getElementById('line1').value = addr.address_line1;
            document.getElementById('city').value = addr.city;
            document.getElementById('pincode').value = addr.pincode;
            document.getElementById('lat').value = addr.latitude;
            document.getElementById('lng').value = addr.longitude;

            document.getElementById('address-modal').style.display = 'flex';
            setTimeout(() => {
                initMap();
                if (addr.latitude && addr.longitude) {
                    updateMarker(parseFloat(addr.latitude), parseFloat(addr.longitude));
                    map.setView([addr.latitude, addr.longitude], 16);
                }
            }, 100);
        }

        function closeModal() {
            document.getElementById('address-modal').style.display = 'none';
        }

        async function loadAddresses() {
            try {
                const res = await api.get('/user/addresses');
                const container = document.getElementById('address-container');
                container.innerHTML = res.data.addresses.map(a => `
                    <div class="a-card ${a.is_default ? 'default' : ''}">
                        <div class="a-icon-circle">
                            <i data-lucide="${a.label.toLowerCase() === 'home' ? 'home' : 'briefcase'}" 
                               style="color: ${a.is_default ? 'var(--primary)' : '#6e6e73'};"></i>
                        </div>
                        <div style="flex: 1;">
                            <div style="display: flex; align-items: center; margin-bottom: 4px;">
                                <h3 style="font-weight: 800; color: #1d1d1f; margin: 0;">${a.label}</h3>
                                ${a.is_default ? '<span class="a-tag">Primary</span>' : ''}
                            </div>
                            <p style="color: #6e6e73; font-weight: 600; font-size: 0.85rem; margin: 0;">
                                ${a.address_line1}${a.city ? ', ' + a.city : ''}
                            </p>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button class="pill-button" onclick="openEditModal(${JSON.stringify(a).replace(/"/g, '&quot;')})" 
                                    style="background: none; border: none; color: var(--primary); cursor: pointer; padding: 8px;">
                                <i data-lucide="edit-3" size="18"></i>
                            </button>
                            <button class="pill-button" onclick="deleteAddress(${a.id})" 
                                    style="background: none; border: none; color: #ff3b30; cursor: pointer; padding: 8px;">
                                <i data-lucide="trash-2" size="18"></i>
                            </button>
                            ${!a.is_default ? `
                            <button class="pill-button" onclick="setDefault(${a.id})" 
                                    style="background: rgba(0,0,0,0.05); color: black; padding: 8px 12px; font-size: 0.7rem; border: none;">
                                Set Default
                            </button>` : ''}
                        </div>
                    </div>
                `).join('');
                lucide.createIcons();
            } catch (err) {
                console.error(err);
            }
        }

        async function saveAddress(e) {
            e.preventDefault();
            const data = {
                label: document.getElementById('label').value,
                address_line1: document.getElementById('line1').value,
                city: document.getElementById('city').value,
                pincode: document.getElementById('pincode').value,
                latitude: document.getElementById('lat').value,
                longitude: document.getElementById('lng').value
            };

            try {
                if (editingId) {
                    await api.put(`/user/addresses/${editingId}`, data);
                } else {
                    await api.post('/user/addresses', data);
                }
                closeModal();
                loadAddresses();
            } catch (err) {
                components.showError("Failed to save address.");
            }
        }

        async function deleteAddress(id) {
            const confirmed = await components.confirm('Delete Address', 'Are you sure you want to remove this address?', 'Yes, Remove');
            if (!confirmed) return;
            try {
                await api.delete(`/user/addresses/${id}`);
                loadAddresses();
            } catch (err) {
                components.showError("Failed to delete address.");
            }
        }

        async function setDefault(id) {
            try {
                await api.put(`/user/addresses/${id}/default`);
                loadAddresses();
            } catch (err) {
                components.showError("Failed to set primary address.");
            }
        }

        loadAddresses();
    </script>
</body>
</html>
</body>
</html>
