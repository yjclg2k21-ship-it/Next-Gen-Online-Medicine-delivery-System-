<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .c-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; height: 100%; }
        .c-item-card { background: rgba(255, 255, 255, 0.4); border-radius: 12px; padding: 12px 16px; border: 1px solid rgba(255, 255, 255, 0.5); margin-bottom: 12px; display: flex; gap: 16px; align-items: center; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .c-item-card:hover { transform: translateX(10px); background: rgba(255, 255, 255, 0.6); }
        .c-icon-box { width: 48px; height: 48px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .c-qty-pill { display: flex; align-items: center; gap: 12px; background: white; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.05); }
        .c-qty-btn { border: none; background: none; color: var(--primary); font-weight: 800; cursor: pointer; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
        .c-summary-panel { background: rgba(255, 255, 255, 0.4); border-radius: var(--l-card-r); padding: 16px 24px; border: 1px solid rgba(255, 255, 255, 0.5); display: flex; flex-direction: column; gap: 16px; }
        .delivery-option { background: rgba(255,255,255,0.3); border: 1px solid rgba(0,0,0,0.05); border-radius: 12px; padding: 8px 16px; cursor: pointer; transition: all 0.3s; }
        .delivery-option.active.tier-standard { background: rgba(13, 148, 136, 0.05); border-color: #0d9488; }
        .delivery-option.active.tier-emergency { background: rgba(255, 59, 48, 0.05); border-color: #ff3b30; }
        .c-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: #6e6e73; font-size: 0.85rem; }
        .c-row.grand-total { border-top: 1px solid rgba(0,0,0,0.05); margin-top: 12px; padding-top: 12px; color: #1d1d1f; font-weight: 800; font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom: 20px;">
                <h1 class="vibrant-h1">Collection</h1>
                <p style="color: #6e6e73; font-size: 1.1rem; font-weight: 500;">Review your pharmaceutical selection for live dispatch.</p>
            </header>

            <div class="c-grid">
                <div id="cartItems" style="overflow-y: auto; padding-right: 10px;">
                    <!-- Dynamic Cart Items injected by Phase 6 -->
                </div>

                <div class="c-summary-panel">
                    <h2 style="font-weight: 800; font-size: 1.4rem;">Calculation</h2>
                    
                    <div id="delivery-selector">
                        <div class="delivery-option active tier-standard" onclick="setDelivery('standard', 35)">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <strong style="font-size: 0.9rem;">Standard Delivery</strong>
                                <span id="standard-price" style="font-weight: 800; color: #1d1d1f;">₹35</span>
                            </div>
                            <div style="font-size: 0.72rem; color: #6e6e73; font-weight: 600;">Takes 12-18 Hrs</div>
                        </div>
                        <div class="delivery-option tier-emergency" style="margin-top: 10px;" onclick="setDelivery('emergency', 65)">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                <strong style="font-size: 0.9rem;">Emergency Delivery</strong>
                                <span id="emergency-price" style="font-weight: 800; color: #1d1d1f;">₹65</span>
                            </div>
                            <div style="font-size: 0.72rem; color: #6e6e73; font-weight: 600;">15-35 mins window 🚨</div>
                        </div>
                    </div>

                    <div style="padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.05);" id="summary-breakdown">
                        <div class="c-row"><span>Items Subtotal</span><span id="subtotalCost">₹0.00</span></div>
                        <div class="c-row"><span>GST (12%)</span><span id="taxCost">₹0.00</span></div>
                        <div class="c-row"><span id="deliveryLabel">Delivery Fee</span><span id="deliveryCost">₹0.00</span></div>
                        <div class="c-row grand-total"><span>Total Payable</span><span id="finalTotal">₹0.00</span></div>
                    </div>

                    <button class="pill-button" onclick="checkout()" style="width: 100%; justify-content: center; padding: 16px; font-size: 1.1rem;">
                        Proceed to Checkout <i data-lucide="arrow-right"></i>
                    </button>
                    <a href="medicines-page.html" style="text-align: center; display: block; margin-top: 20px; color: #6e6e73; font-weight: 700; text-decoration: none; font-size: 0.85rem;">Add more items</a>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'user') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('user');
        lucide.createIcons();

        let apiCartItems = [];
        let selectedTier = 'standard';
        let baseDeliveryFee = 35;
        let badWeatherActive = false;

        async function loadCart() {
            try {
                components.showLoader();
                const [cartData, weatherRes] = await Promise.all([
                    api.get('/cart'),
                    api.get('/settings/bad-weather').catch(() => ({ bad_weather: 0 }))
                ]);
                apiCartItems = cartData.data.items || [];
                badWeatherActive = (weatherRes.bad_weather === 1 || weatherRes.data?.bad_weather === 1);
                renderCart();
            } catch (err) {
                console.error(err);
                components.showError("Clinical cart synchronization failed.");
            } finally {
                components.hideLoader();
            }
        }

        function renderCart() {
            const container = document.getElementById('cartItems');
            if (!apiCartItems || apiCartItems.length === 0) {
                container.innerHTML = `
                <div style="text-align: center; padding: 60px; background: rgba(255,255,255,0.3); border-radius: var(--l-card-r); border: 2px dashed rgba(0,0,0,0.05);">
                    <i data-lucide="shopping-cart" size="48" style="color: #6e6e73; margin-bottom: 16px; opacity: 0.5;"></i>
                    <h3 style="color: #6e6e73; font-weight: 800;">Your clinical cart is empty</h3>
                    <a href="medicines-page.html" class="pill-button" style="margin-top:20px; display:inline-flex;">Browse Inventory</a>
                </div>`;
                lucide.createIcons();
                updateSummary();
                return;
            }

            container.innerHTML = apiCartItems.map(item => `
                <div class="c-item-card" style="padding: 10px 16px; min-height: 80px;">
                    <div class="c-icon-box" style="width: 54px; height: 54px; flex-shrink: 0; overflow: hidden; padding: 0;">
                        <img src="../assets/images/medicines/${item.image || 'placeholder-med.png'}" 
                             onerror="this.src='../assets/images/placeholder-med.png'"
                             style="width: 100%; height: 100%; object-fit: cover;">
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: 800; font-size: 1rem; color: #1d1d1f; margin-bottom: 2px;">${item.name}</div>
                        <div style="color: #6e6e73; font-size: 0.7rem; font-weight: 600; margin-bottom: 6px;">Variant: <span style="color: #007aff; font-weight: 800; text-transform: uppercase;">${item.brand_type || 'Standard'}</span></div>
                        <div class="c-qty-pill" style="width: fit-content; padding: 4px 10px;">
                             <button class="c-qty-btn" style="font-size: 0.9rem;" onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>
                             <span style="font-weight: 800; min-width: 16px; text-align: center; font-size: 0.9rem;">${item.quantity}</span>
                             <button class="c-qty-btn" style="font-size: 0.9rem;" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: 800; font-size: 1.1rem; color: #007aff; margin-bottom: 6px;">₹${(parseFloat(item.price) * item.quantity).toFixed(2)}</div>
                        <button style="background: none; border: none; color: #ff3b30; cursor: pointer; padding: 4px;" onclick="removeItem(${item.id})"><i data-lucide="trash-2" size="16"></i></button>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
            updateSummary();
        }

        window.updateQty = async (itemId, newQty) => {
            if (newQty <= 0) { removeItem(itemId); return; }
            try {
                components.showLoader();
                await api.put(`/cart/${itemId}`, { qty: newQty });
                loadCart();
            } catch (err) { console.error(err); } finally { components.hideLoader(); }
        };

        window.removeItem = async (itemId) => {
            const confirmed = await components.confirm('Remove Item', 'Remove this item from your cart?', 'Yes, Remove');
            if (!confirmed) return;
            try {
                components.showLoader();
                await api.delete(`/cart/${itemId}`);
                loadCart();
            } catch (err) { console.error(err); } finally { components.hideLoader(); }
        };

        window.setDelivery = (tier, fee) => {
            selectedTier = tier;
            baseDeliveryFee = fee;
            document.querySelectorAll('.delivery-option').forEach(opt => opt.classList.remove('active'));
            document.querySelector(`.tier-${tier}`).classList.add('active');
            updateSummary();
        };

        function updateSummary() {
            let subtotal = apiCartItems.reduce((sum, item) => sum + (parseFloat(item.price) * item.quantity), 0);
            let tax = subtotal * 0.12;
            
            // Dynamic Pricing Logic
            let standardPrice = subtotal > 1000 ? 0 : 35;
            let emergencyPrice = subtotal > 1000 ? 32.50 : 65;
            
            // Update Option UI
            document.getElementById('standard-price').innerText = standardPrice === 0 ? 'FREE' : '₹' + standardPrice;
            document.getElementById('emergency-price').innerText = subtotal > 1000 ? '₹32.50 (50% OFF)' : '₹' + emergencyPrice;
            
            let delivery = 0;
            if (subtotal > 0) {
                delivery = selectedTier === 'emergency' ? emergencyPrice : standardPrice;
            }

            // Night Charge Check (9 PM to 6 AM)
            const hour = new Date().getHours();
            const nightCharge = (hour >= 21 || hour < 6) ? 15.00 : 0.00;
            
            // Weather Charge
            const weatherCharge = badWeatherActive ? 12.00 : 0.00;

            const totalDelivery = delivery + nightCharge + weatherCharge;
            const total = subtotal + tax + totalDelivery;

            document.getElementById('summary-breakdown').innerHTML = `
                <div class="c-row"><span>Items Subtotal</span><span id="subtotalCost">₹${subtotal.toFixed(2)}</span></div>
                <div class="c-row"><span>GST (12%)</span><span id="taxCost">₹${tax.toFixed(2)}</span></div>
                <div class="c-row"><span id="deliveryLabel">Delivery Fee (Base)</span><span id="deliveryCost">${(delivery === 0 && subtotal > 0) ? 'FREE' : '₹' + delivery.toFixed(2)}</span></div>
                ${nightCharge > 0 ? `
                <div class="c-row" style="color: #ff9500; font-weight: 700;">
                    <span>🌙 Night Surcharge</span><span>₹${nightCharge.toFixed(2)}</span>
                </div>` : ''}
                ${weatherCharge > 0 ? `
                <div class="c-row" style="color: #ff3b30; font-weight: 700;">
                    <span>🌧️ Weather Surcharge</span><span>₹${weatherCharge.toFixed(2)}</span>
                </div>` : ''}
                <div class="c-row grand-total"><span>Total Payable</span><span id="finalTotal">₹${total.toFixed(2)}</span></div>
            `;
        }

        async function checkout() {
            if (apiCartItems.length === 0) { components.showError("Cart is empty."); return; }
            window.location.href = `checkout-ui.html?tier=${selectedTier}`;
        }

        loadCart();
    </script>
</body>
</html>
