<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .t-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
            height: 100%;
        }

        .map-glass {
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--l-card-r);
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
            overflow: hidden;
            height: 100%;
        }
        #map { height: 100%; width: 100%; z-index: 1; border-radius: var(--l-card-r); }
        .map-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            padding: 12px 20px; border-radius: 100px; border: 1px solid white;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }


        .status-glass {
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--l-card-r);
            padding: var(--l-card-p);
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
        }

        .t-line {
            position: relative;
            padding-left: 40px;
            margin-top: 32px;
        }
        .t-line::before {
            content: ''; position: absolute; left: 7px; top: 10px; bottom: 0;
            width: 2px; background: rgba(0,0,0,0.05);
        }

        .t-node { position: relative; margin-bottom: 16px; }
        .t-node::after {
            content: ''; position: absolute; left: -39px; top: 4px;
            width: 16px; height: 16px; border-radius: 50%; background: white;
            border: 4px solid #e2e8f0;
        }
        .t-node.active::after { background: var(--primary); border-color: rgba(0, 122, 255, 0.2); box-shadow: 0 0 0 10px rgba(0, 122, 255, 0.1); }
        .t-node.done::after { background: var(--success); border-color: transparent; }

        .map-marker-pulse {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; background: var(--primary); opacity: 0.4;
            animation: pulse-marker 2s infinite; z-index: -1;
        }
        @keyframes pulse-marker {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>
    
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        
        <main class="liquid-main">
            <header style="margin-bottom: 16px; display: flex; align-items: center; gap: 24px;">
                <a id="back-btn" href="orders-page.html" class="pill-button" style="background: white; color: black; border: 1px solid rgba(0,0,0,0.1); padding: 12px;"><i data-lucide="arrow-left"></i></a>
                <div>
                    <h1 class="vibrant-h1">Real-time Tracking</h1>
                    <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Tracking order delivery for <span id="display-order-id">#MM-ORD-84392</span>.</p>
                </div>
            </header>

            <div class="t-grid">
                <div class="map-glass">
                    <div class="map-overlay">
                        <span style="font-weight: 800; color: #1d1d1f; display: flex; align-items: center; gap: 8px;">
                            <i data-lucide="navigation" style="width: 16px; color: var(--primary);"></i>
                            Live GPS Location
                        </span>
                    </div>
                    <div id="map"></div>
                </div>


                <div class="status-glass">
                    <div style="background: white; border-radius: var(--l-card-r); padding: var(--l-card-p); margin-bottom: 16px; border: 1px solid rgba(0,0,0,0.05);">
                        <div style="color: #6e6e73; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">Estimated Arrival</div>
                        <div style="font-size: 1.8rem; font-weight: 900; color: var(--primary);" id="eta-time">4:32 PM</div>
                        <div style="margin-top: 12px; font-weight: 700; font-size: 0.8rem; color: var(--success);" id="dispatch-agent">UNASSIGNED</div>
                    </div>

                    <div id="delivery-otp-box" style="background: rgba(52, 199, 89, 0.08); border: 1px solid rgba(52, 199, 89, 0.2); border-radius: 12px; padding: 12px; display: none; align-items: center; justify-content: space-between; margin-bottom: 16px;">
                        <div>
                            <div style="font-size: 0.65rem; color: #34c759; font-weight: 800; text-transform: uppercase;">Delivery Handover OTP</div>
                            <div style="font-size: 1.4rem; font-weight: 950; letter-spacing: 2px; color: #1d1d1f; margin-top: 2px;" id="delivery-otp-val">------</div>
                        </div>
                        <div style="color: #34c759;"><i data-lucide="key-round" style="width:20px;height:20px;"></i></div>
                    </div>

                    <div class="t-line" id="tracking-steps">
                        <!-- Dynamic Steps -->
                    </div>

                    <div style="margin-top: auto;">
                        <button class="pill-button" onclick="window.location.href='tel:+919876543210'" style="width: 100%; justify-content: center; padding: 12px 16px; background: rgba(0,0,0,0.05); color: #1d1d1f; cursor: pointer;"><i data-lucide="phone"></i> Contact Courier</button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        // Check Auth
        const user = auth.getUser();
        if (!user) { window.location.href = '../auth/login.html'; }

        // Role-based Nav
        const isVendor = user.role === 'vendor';
        const backLink = isVendor ? '../vendor/vendor-orders.html' : 'orders-page.html';
        document.getElementById('back-btn').href = backLink;
        
        // Load Sidebar
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar(user.role);
        lucide.createIcons();

        // Redirect if no order ID in URL params
        const urlParams = new URLSearchParams(window.location.search);
        let orderId = urlParams.get('id');
        if (!orderId) {
            async function redirectLatestTracking() {
                try {
                    components.showLoader();
                    const res = await api.get('/orders');
                    const orders = res.data.orders || [];
                    const activeOrders = orders.filter(o => ['placed', 'processing', 'shipped', 'pending', 'confirmed', 'dispatched'].includes(o.status));
                    const targetOrder = activeOrders.length > 0 ? activeOrders[activeOrders.length - 1] : orders[orders.length - 1];
                    if (targetOrder) {
                        window.location.href = `order-tracking-map.html?id=${targetOrder.id}`;
                        return;
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    components.hideLoader();
                }
                window.location.href = isVendor ? '../vendor/vendor-orders.html' : 'orders-page.html';
            }
            redirectLatestTracking();
        }

        // Initialize Map (Default: Phaltan)
        const map = L.map('map', { zoomControl: false }).setView([17.9868, 74.4379], 13);
        
        // Colorful Voyager Theme - Better Visibility
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
            attribution: '&copy; CartoDB'
        }).addTo(map);

        let courierMarker, vendorMarker, customerMarker, routeLine;

        // Custom Markers
        const courierIcon = L.divIcon({
            className: 'courier-marker',
            html: '<div style="background: var(--primary); color: white; padding: 10px; border-radius: 50%; box-shadow: 0 0 20px rgba(0, 122, 255, 0.6); position:relative;"><i data-lucide="truck" style="width: 20px; height: 20px;"></i><div class="map-marker-pulse"></div></div>',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
        });

        const vendorIcon = L.divIcon({
            className: 'vendor-marker',
            html: '<div style="background: #34c759; color: white; padding: 8px; border-radius: 50%; border: 2px solid white;"><i data-lucide="pill" style="width: 16px; height: 16px;"></i></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        const customerIcon = L.divIcon({
            className: 'customer-marker',
            html: '<div style="background: #ff3b30; color: white; padding: 8px; border-radius: 50%; border: 2px solid white;"><i data-lucide="home" style="width: 16px; height: 16px;"></i></div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        async function loadTrackingData() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');
            if (!orderId) return;
            
            try {
                const res = await api.get(`/orders/${orderId}/tracking`);
                const data = res.data;
                
                // Update UI
                document.getElementById('display-order-id').innerText = `#MM-ORD-${orderId}`;
                
                // Update Agent Info
                const agent = data.rider ? data.rider.name : 'Rider Not Assigned';
                document.getElementById('dispatch-agent').innerText = `DRIVING: ${agent.toUpperCase()}`;

                if (data.delivery_otp) {
                    document.getElementById('delivery-otp-box').style.display = 'flex';
                    document.getElementById('delivery-otp-val').innerText = data.delivery_otp;
                }
                
                if (data.telemetry) {
                    const riderPos = [data.telemetry.coordinates.lat, data.telemetry.coordinates.lng];
                    const vendorPos = [data.telemetry.vendor_location.lat, data.telemetry.vendor_location.lng];
                    const customerPos = [data.telemetry.customer_location.lat, data.telemetry.customer_location.lng];

                    // 1. Add/Update Markers
                    if (!vendorMarker) vendorMarker = L.marker(vendorPos, { icon: vendorIcon }).addTo(map).bindPopup('Pharmacy Location');
                    if (!customerMarker) customerMarker = L.marker(customerPos, { icon: customerIcon }).addTo(map).bindPopup('Your Destination');

                    if (data.rider && data.rider.name !== 'Searching...') {
                        if (courierMarker) {
                            courierMarker.setLatLng(riderPos);
                        } else {
                            courierMarker = L.marker(riderPos, { icon: courierIcon }).addTo(map).bindPopup(`${data.rider.name} (Delivery Rider)`);
                        }
                    }

                    // 2. Draw Route (Polyline)
                    const routePath = [vendorPos, riderPos, customerPos];
                    if (routeLine) {
                        routeLine.setLatLngs(routePath);
                    } else {
                        routeLine = L.polyline(routePath, {
                            color: '#007aff',
                            weight: 4,
                            opacity: 0.6,
                            dashArray: '10, 10'
                        }).addTo(map);
                    }

                    // 3. Adjust View
                    map.fitBounds(L.polyline(routePath).getBounds(), { padding: [100, 100], maxZoom: 15 });
                }

                // Update Status History
                const stepsContainer = document.getElementById('tracking-steps');
                if (data.steps && data.steps.length > 0) {
                    stepsContainer.innerHTML = data.steps.map((s, idx) => `
                        <div class="t-node ${idx === data.steps.length - 1 ? 'active' : 'done'}">
                            <h4 style="font-weight: 800; color: #1d1d1f; text-transform: capitalize;">${s.status}</h4>
                            <p style="font-size: 0.85rem; color: #6e6e73; font-weight: 600;">${new Date(s.changed_at).toLocaleTimeString()}</p>
                        </div>
                    `).join('');
                } else {
                    stepsContainer.innerHTML = '<div class="t-node active"><h4 style="font-weight: 800; color: #1d1d1f;">Order Placed</h4><p style="font-size: 0.85rem; color: #6e6e73; font-weight: 600;">Awaiting processing</p></div>';
                }
                
                lucide.createIcons();
            } catch (err) { console.error('Tracking error:', err); }
        }

        loadTrackingData();
        // Refresh tracking every 10 seconds
        setInterval(loadTrackingData, 10000);

    </script>
</body>
</html>
