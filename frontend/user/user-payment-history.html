<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .l-container {
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--l-card-r);
            padding: var(--l-card-p);
            border: 1px solid rgba(255, 255, 255, 0.5);
            flex: 1;
            overflow-y: auto;
        }

        .l-row {
            display: grid;
            grid-template-columns: 140px 1fr 150px 120px 100px;
            padding: var(--l-card-p);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            align-items: center;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .l-row:hover { background: rgba(255,255,255,0.3); border-radius: var(--l-card-r); }

        .l-id { font-family: monospace; color: #6e6e73; font-weight: 700; font-size: 0.8rem; }
        .l-order { font-weight: 800; color: var(--primary); }
        .l-method { color: #1d1d1f; font-weight: 600; }
        .l-amount { font-weight: 900; text-align: right; color: #1d1d1f; }
        .l-status { text-align: right; }

        .filter-bar {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 16px 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #8e8e93;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0,0,0,0.05);
            background: white;
            font-weight: 700;
            font-size: 0.85rem;
            color: #1d1d1f;
            cursor: pointer;
            outline: none;
        }
        .filter-select:focus { border-color: var(--primary); }
    </style>
</head>
<body>
    
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        
        <main class="liquid-main">
            <header style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="vibrant-h1">Payments</h1>
                    <p style="color: #6e6e73; font-size: 1.2rem; font-weight: 500;">Financial history and transaction updates.</p>
                </div>
                <a href="user-addresses.html" style="margin-bottom: 8px; color: var(--primary); font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px;">
                    <i data-lucide="arrow-left" size="18"></i> Back to Wallet
                </a>
            </header>

            <!-- Horizontal Filter Bar -->
            <div class="filter-bar animate-scale-in">
                <div class="filter-group">
                    <label class="filter-label">Method:</label>
                    <select id="filter-method" class="filter-select" onchange="applyFilters()">
                        <option value="all">All Methods</option>
                        <option value="card">Card Payment</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Status:</label>
                    <select id="filter-status" class="filter-select" onchange="applyFilters()">
                        <option value="all">All Statuses</option>
                        <option value="paid">Settled</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Sort:</label>
                    <select id="filter-sort" class="filter-select" onchange="applyFilters()">
                        <option value="newest">Date: Newest</option>
                        <option value="oldest">Date: Oldest</option>
                        <option value="amount_high">Amount: High → Low</option>
                        <option value="amount_low">Amount: Low → High</option>
                    </select>
                </div>
                <div style="flex: 1;"></div>
                <button class="pill-button" onclick="resetFilters()" style="padding: 8px 16px; font-size: 0.8rem; background: #1d1d1f; color: white;">
                    Reset <i data-lucide="refresh-cw" size="12"></i>
                </button>
            </div>

            <div class="l-container" id="ledger-container">
                <div style="display: grid; grid-template-columns: 140px 1fr 150px 120px 100px; padding: 0 24px 15px 24px; color: #6e6e73; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;">
                    <span>Time / ID</span>
                    <span>Order Ref</span>
                    <span>Method</span>
                    <span style="text-align: right;">Amount</span>
                    <span style="text-align: right;">Status</span>
                </div>
                
                <div id="ledger-content">
                    <!-- Dynamic Ledger Entries -->
                </div>
            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        // Check Auth
        const user = auth.getUser();
        if (!user) { window.location.href = '../auth/login.html'; }

        // Load Sidebar
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('user');
        lucide.createIcons();

        let allOrders = [];

        async function loadLedger() {
            try {
                components.showLoader();
                const res = await api.get('/orders');
                allOrders = res.data.orders || [];
                renderLedger(allOrders);
            } catch (err) {
                console.error(err);
                components.showError("Failed to load transactions.");
            } finally {
                components.hideLoader();
            }
        }

        function renderLedger(history) {
            const container = document.getElementById('ledger-content');

            if (history.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px; color: #6e6e73; font-weight: 600;">
                        No matching transactions found.
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map(order => `
                <div class="l-row">
                    <div>
                        <div style="font-weight: 700;">${new Date(order.created_at).toLocaleDateString()}</div>
                        <div class="l-id">#TXN-${order.id}</div>
                    </div>
                    <div class="l-order">ORD-${order.id}</div>
                    <div class="l-method">${order.payment_method.toUpperCase()}</div>
                    <div class="l-amount">₹${parseFloat(order.grand_total).toFixed(2)}</div>
                    <div class="l-status">
                        <span style="color: ${order.payment_status === 'paid' ? 'var(--success)' : 'var(--warning)'}; font-weight: 800; font-size: 0.75rem;">
                            ${order.payment_status === 'paid' ? 'SETTLED ✓' : 'PENDING 🕒'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const method = document.getElementById('filter-method').value;
            const status = document.getElementById('filter-status').value;
            const sort = document.getElementById('filter-sort').value;

            let filtered = [...allOrders];

            if (method !== 'all') {
                filtered = filtered.filter(o => o.payment_method.toLowerCase() === method);
            }

            if (status !== 'all') {
                filtered = filtered.filter(o => o.payment_status === status);
            }

            if (sort === 'newest') filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            else if (sort === 'oldest') filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            else if (sort === 'amount_high') filtered.sort((a, b) => parseFloat(b.grand_total) - parseFloat(a.grand_total));
            else if (sort === 'amount_low') filtered.sort((a, b) => parseFloat(a.grand_total) - parseFloat(b.grand_total));

            renderLedger(filtered);
        }

        function resetFilters() {
            document.getElementById('filter-method').value = 'all';
            document.getElementById('filter-status').value = 'all';
            document.getElementById('filter-sort').value = 'newest';
            renderLedger(allOrders);
        }

        loadLedger();
    </script>
</body>
</html>
