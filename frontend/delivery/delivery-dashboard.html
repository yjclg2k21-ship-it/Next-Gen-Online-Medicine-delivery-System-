<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Dashboard | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .map-preview { background: rgba(255, 255, 255, 0.4); border-radius: var(--l-card-r); height: 260px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .delivery-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-bottom: 20px; }
        .delivery-stat-grid .delivery-card { text-align: center; }
        .delivery-card { background: rgba(255,255,255,0.4); padding: var(--l-card-p); border-radius: var(--l-card-r); border: 1px solid rgba(255,255,255,0.5); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .dispatch-queue { background: rgba(255,255,255,0.4); border-radius: var(--l-card-r); padding: var(--l-card-p); border: 1px solid rgba(255,255,255,0.5); flex: 1; overflow-y: auto; }
        .assignment-row { padding: 20px; background: white; border-radius: 16px; border: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; transition: transform 0.3s; }
        .assignment-row:hover { transform: scale(1.01); box-shadow: 0 8px 24px rgba(0,0,0,0.03); }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #34c759; }
        input:focus + .slider { box-shadow: 0 0 1px #34c759; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>
    <div class="squircle-card animate-scale-in">
        <aside class="liquid-sidebar" id="sidebar-root"></aside>
        <main class="liquid-main">
            <header style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="vibrant-h1">Fleet Intelligence</h1>
                    <p style="color: #6e6e73; font-size: 1.1rem; font-weight: 500;">Active Area: <b id="area-label">Phaltan Central</b>. Fleet Status: Online.</p>
                </div>
                <div style="display:flex; align-items:center; gap:12px;">
                    <span style="font-weight:700; font-size:0.9rem;" id="duty-label">Duty: ONLINE</span>
                    <label class="switch">
                        <input type="checkbox" id="duty-toggle" checked onchange="toggleDuty()">
                        <span class="slider round"></span>
                    </label>
                </div>
            </header>

            <div class="delivery-stat-grid">
                <div class="delivery-card">
                    <div style="color: #6e6e73; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">Standard</div>
                    <div style="font-size: var(--l-h1); font-weight: 800;" id="stat-standard">0</div>
                    <div style="margin-top: 12px; font-size: 0.75rem; color: var(--primary); font-weight: 700;">In Queue</div>
                </div>
                <div class="delivery-card" style="border-color: #ff3b30; background: rgba(255, 59, 48, 0.05);">
                    <div style="color: #ff3b30; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">🚨 Emergency</div>
                    <div style="font-size: var(--l-h1); font-weight: 800; color: #ff3b30;" id="stat-emergency">0</div>
                    <div style="margin-top: 12px; font-size: 0.75rem; color: #ff3b30; font-weight: 700;">Urgent Pickups</div>
                </div>
                <div class="delivery-card">
                    <div style="color: #6e6e73; font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">Fulfillment</div>
                    <div style="font-size: var(--l-h1); font-weight: 800;" id="stat-completed">0</div>
                    <div style="margin-top: 12px; font-size: 0.75rem; color: var(--success); font-weight: 700;">Shift Total</div>
                </div>
            </div>

            <div class="dispatch-queue">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3 class="vibrant-h2">Dispatch Queue</h3>
                    <button class="pill-button" onclick="loadQueue()"><i data-lucide="refresh-cw" size="16"></i></button>
                </div>
                <div id="queue-list">
                    <!-- Dynamic Assignments -->
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/liquid.js"></script>
    <script>
        const user = auth.getUser();
        if (!user || user.role !== 'delivery') window.location.href = '../auth/login.html';
        document.getElementById('sidebar-root').innerHTML = components.liquidSidebar('delivery');
        lucide.createIcons();

        async function loadQueue(silent = false) {
            try {
                if (!silent) components.showLoader();
                
                // Fetch Profile for Area
                const profileRes = await api.get('/delivery/partner/settings');
                if (profileRes.success && profileRes.data) {
                    const area = profileRes.data.vehicle.split('(')[1]?.replace(')', '') || 'Assigned Sector';
                    document.getElementById('area-label').textContent = area;
                }

                const data = await api.get('/delivery/dispatch/queue');
                const res = (data && data.data) ? data.data : { queue: [], stats: { pending: 0, active: 0, completed_today: 0 } };
                const queue = res.queue || [];
                const stats = res.stats || {};

                // Update Stats
                document.getElementById('stat-standard').textContent = stats.pending || 0;
                document.getElementById('stat-emergency').textContent = stats.active || 0;
                document.getElementById('stat-completed').textContent = stats.completed_today || 0;

                renderQueue(queue);

                // --- Emergency Priority Alert ---
                const emergencyCount = queue.filter(o => o.type === 'emergency' || o.is_emergency).length;
                if (emergencyCount > 0) {
                    components.showError(`🚨 PRIORITY: ${emergencyCount} Emergency order(s) waiting in your sector!`, 10000);
                }

            } catch (err) {
                console.error(err);
                components.showError("Fleet synchronization failed.");
            } finally {
                if (!silent) components.hideLoader();
            }
        }

        function renderQueue(list) {
            const container = document.getElementById('queue-list');
            if (!list || list.length === 0) {
                container.innerHTML = '<div style="padding:60px; text-align:center; color:#8e8e93; font-weight:600;">No active dispatches in your clinical sector.</div>';
                return;
            }

            container.innerHTML = list.map(item => {
                const isEmergency = item.type === 'emergency';
                return `
                <div class="assignment-row">
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <div style="width: 52px; height: 52px; background: ${isEmergency ? 'rgba(255, 59, 48, 0.1)' : 'rgba(0, 122, 255, 0.1)'}; border-radius: 12px; display: flex; align-items: center; justify-content: center;"><i data-lucide="${isEmergency ? 'zap' : 'package'}" style="color: ${isEmergency ? '#ff3b30' : '#007aff'};"></i></div>
                        <div>
                            <div style="font-weight: 800; font-size: 1.05rem; display:flex; align-items:center; gap:8px;">
                                #ORD-${item.id} 
                                ${isEmergency ? '<span style="background:#ff3b30; color:white; padding:2px 6px; border-radius:6px; font-size:0.6rem;">URGENT</span>' : ''}
                            </div>
                            <div style="color: #6e6e73; font-size: 0.85rem; font-weight:600;">Customer: ${item.customer} • ${item.address}</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:12px;">
                        <button class="pill-button btn-outline" style="padding:10px 20px; font-size:0.85rem;" onclick="viewDetail(${item.id})">Details</button>
                        <button class="pill-button" style="padding:10px 20px; font-size:0.85rem;" onclick="acceptOrder(${item.id})">
                            Accept Order
                        </button>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        async function acceptOrder(orderId) {
            const confirmed = await components.confirm('Accept Order', `Are you sure you want to accept Order #ORD-${orderId}?`, 'Yes, Accept');
            if (!confirmed) return;

            try {
                components.showLoader();
                await api.post(`/delivery/orders/${orderId}/accept`);
                components.showSuccess(`Order #ORD-${orderId} accepted successfully!`);
                loadQueue();
            } catch (err) { 
                console.error(err); 
                components.showError("Failed to accept order.");
            } finally { 
                components.hideLoader(); 
            }
        }

        // --- Real-time Location Telemetry ---
        function startTracking() {
            if (navigator.geolocation) {
                setInterval(() => {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                        try {
                            await api.post('/delivery/location', {
                                latitude: pos.coords.latitude,
                                longitude: pos.coords.longitude
                            });
                            console.log("Logistics node ping: Successful");
                        } catch (e) { console.warn("Logistics node ping: Failed", e); }
                    }, (err) => console.warn("GPS Access Denied"), { enableHighAccuracy: true });
                }, 30000); // Every 30 seconds
            }
        }

        async function toggleDuty() {
            const isOnline = document.getElementById('duty-toggle').checked;
            const status = isOnline ? 'active' : 'inactive';
            try {
                const res = await api.post('/delivery/duty/toggle', { status });
                if (res.success) {
                    document.getElementById('duty-label').textContent = `Duty: ${status.toUpperCase()}`;
                    components.showSuccess(`Fleet status transitioned to ${status.toUpperCase()}`);
                }
            } catch (e) {
                document.getElementById('duty-toggle').checked = !isOnline;
                components.showError("Failed to synchronize duty status.");
            }
        }

        function viewDetail(id) {
            window.location.href = `delivery-order-details.html?id=${id}`;
        }

        loadQueue();
        startTracking();

        // Auto-refresh every 10 seconds (realtime polling)
        setInterval(() => {
            loadQueue(true);
        }, 10000);
    </script>
</body>
</html>
