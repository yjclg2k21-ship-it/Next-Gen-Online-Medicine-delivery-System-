<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Layout | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .auth-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border-radius: var(--l-card-r);
            padding: var(--l-card-p);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
        }

        .auth-logo {
            font-size: 3rem;
            margin-bottom: 16px;
            display: inline-block;
        }

        .auth-input {
            width: 100%;
            padding: 24px 24px;
            border-radius: var(--l-card-r);
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .auth-input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>
    
    <div class="auth-container animate-scale-in">
        <div class="auth-logo">➕</div>
        <h1 class="vibrant-h2" style="margin-bottom: 8px;">MediMitra</h1>
        <p style="color: #6e6e73; margin-bottom: 20px;">Online Pharmacy System</p>

        <form>
            <input type="email" class="auth-input" placeholder="Email Address">
            <input type="password" class="auth-input" placeholder="Password">
            <button class="pill-button" style="width: 100%; justify-content: center; margin-top: 16px;">Sign In</button>
        </form>

        <p style="margin-top: 32px; font-size: 0.9rem; color: #6e6e73;">
            Don't have an account? <a href="#" style="color: var(--primary); text-decoration: none; font-weight: 700;">Register here</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/liquid.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
