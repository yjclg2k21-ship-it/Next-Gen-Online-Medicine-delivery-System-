<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/liquid.css">
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-y: auto; padding: 20px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .auth-glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 60px;
            padding: var(--l-card-p);
            width: 100%;
            max-width: 460px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            z-index: 1000;
            box-sizing: border-box;
        }

        .auth-input {
            width: 100%; padding: 20px 24px; border-radius: 18px;
            border: 1px solid rgba(0,0,0,0.05); background: white;
            font-weight: 600; font-size: 1rem; color: #1d1d1f;
            margin-bottom: 20px; transition: all 0.3s; box-sizing: border-box;
        }
        .auth-input:focus { border-color: var(--primary); transform: scale(1.01); outline: none; }

        @media (max-width: 576px) {
            body {
                padding: 16px;
            }
            .auth-glass-card {
                border-radius: 28px;
                padding: 32px 20px;
            }
            .auth-glass-card h1 {
                font-size: 1.75rem !important;
            }
            .auth-input {
                padding: 16px 20px;
                font-size: 0.95rem;
                margin-bottom: 16px;
                border-radius: 14px;
            }
            .pill-button {
                padding: 16px !important;
                font-size: 0.95rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="liquid-canvas">
        <div class="liquid-orb orb-1"></div>
        <div class="liquid-orb orb-2"></div>
        <div class="liquid-orb orb-3"></div>
    </div>

    <div class="auth-glass-card animate-scale-in">
        <div style="font-size: 3rem; margin-bottom: 16px;">🔐</div>
        <h1 class="vibrant-h1" style="font-size: 2rem; margin-bottom: 8px;">Forgot Password?</h1>
        <p style="color: #6e6e73; font-weight: 600; font-size: 0.95rem; margin-bottom: 30px;">Enter your email and we'll send you a reset link.</p>
        
        <form id="forgot-form" onsubmit="handleForgot(event)">
            <input type="email" class="auth-input" id="email" placeholder="Email Address" required>
            <button type="submit" class="pill-button" id="submit-btn" style="width:100%; justify-content:center; padding:18px; font-size:1rem;">
                <i data-lucide="send"></i> Send Reset Link
            </button>
        </form>

        <div id="success-msg" style="display:none; margin-top:24px;">
            <div style="background:rgba(52,199,89,0.1); color:#34c759; padding:20px; border-radius:18px; font-weight:700; font-size:0.95rem;">
                ✓ Reset link sent! Check your inbox.
            </div>
            <p style="font-size:0.85rem; color:#8e8e93; margin-top:16px; font-weight:600;">Didn't receive it? <a href="#" onclick="location.reload()" style="color:var(--primary); font-weight:800; text-decoration:none;">Resend</a></p>
        </div>

        <div id="error-msg" style="display:none; margin-top:16px;">
            <div style="background:rgba(255,59,48,0.1); color:#ff3b30; padding:16px; border-radius:14px; font-weight:700; font-size:0.85rem;" id="error-text"></div>
        </div>

        <div style="margin-top:30px; font-size:0.9rem;">
            <a href="login.html" style="color:var(--primary); font-weight:800; text-decoration:none;">← Back to Login</a>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        lucide.createIcons();

        async function handleForgot(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-msg');
            errorDiv.style.display = 'none';

            if (!email) {
                errorDiv.style.display = 'block';
                document.getElementById('error-text').textContent = 'Please enter your email address.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader"></i> Sending...';
            
            try {
                const response = await api.post('/auth/forgot-password', { email });
                if (response.success) {
                    document.getElementById('forgot-form').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                    
                    // Demo mode: show reset link directly if debug_token available
                    if (response.debug_token) {
                        const resetUrl = window.location.href.replace('forgot-password.html', 'reset-password.html') + '?token=' + response.debug_token;
                        document.getElementById('success-msg').innerHTML += `
                            <div style="margin-top:16px; background:rgba(0,122,255,0.05); padding:16px; border-radius:14px; text-align:left;">
                                <div style="font-size:0.72rem; font-weight:800; color:#007aff; text-transform:uppercase; margin-bottom:8px;">🔗 Demo Mode — Reset Link</div>
                                <a href="${resetUrl}" style="color:#007aff; font-weight:700; font-size:0.85rem; word-break:break-all; text-decoration:underline;">${resetUrl}</a>
                            </div>
                        `;
                    }
                } else {
                    document.getElementById('forgot-form').style.display = 'none';
                    document.getElementById('success-msg').style.display = 'block';
                }
            } catch(err) {
                // Show success anyway (anti-enumeration pattern)
                document.getElementById('forgot-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
