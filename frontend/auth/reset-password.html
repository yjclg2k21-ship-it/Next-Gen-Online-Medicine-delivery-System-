<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | MediMitra</title>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.363.0/dist/umd/lucide.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/glass.css">
    <style>
        body { background: #fbfbfd; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        .auth-card { background: #fff; padding: 40px 30px; border-radius: 28px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; }
        .form-input { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.1); font-size: 1rem; margin-bottom: 20px; outline: none; box-sizing: border-box; }
        .form-input:focus { border-color: #007aff; }
        .btn-primary { width: 100%; padding: 14px; border-radius: 14px; background: #1d1d1f; color: #fff; border: none; font-weight: 700; cursor: pointer; font-size: 1rem; box-sizing: border-box; }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .auth-card h1 {
                font-size: 1.5rem !important;
            }
            .form-input {
                padding: 12px 16px;
                font-size: 0.95rem;
                margin-bottom: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card animate-scale-in">
        <h1 style="font-weight:800; font-size:1.75rem; margin-bottom:8px;">New Password</h1>
        <p style="color:#8e8e93; font-size:0.9rem; margin-bottom:30px;">Create a new password for your account.</p>
        
        <form id="reset-form" onsubmit="handleReset(event)">
            <input type="password" class="form-input" id="password" placeholder="New Password" required minlength="8">
            <input type="password" class="form-input" id="confirm" placeholder="Confirm Password" required>
            <button type="submit" class="btn-primary" id="submit-btn">Update Password</button>
        </form>

        <div id="success-msg" style="display:none; margin-top:20px;">
            <div style="background:rgba(52,199,89,0.1); color:#34c759; padding:16px; border-radius:14px; font-weight:600; font-size:0.9rem; margin-bottom:20px;">
                ✓ Password updated successfully!
            </div>
            <a href="login.html" class="btn-primary" style="display:block; text-decoration:none; padding:10px;">Login Now</a>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        async function handleReset(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm').value;
            if (password !== confirm) { components.showError('Passwords do not match'); return; }
            
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.textContent = 'Updating...';
            
            try {
                await api.post('/auth/reset-password', {
                    token: token,
                    password: password,
                    password_confirmation: password
                });
            } catch(e) {
                if (window.components && window.components.showError) {
                    window.components.showError(e.message || "Reset failed.");
                } else {
                    components.showError(e.message || "Reset failed.");
                }
                btn.textContent = 'Update Password';
                btn.disabled = false;
                return;
            }
            
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
</html>
